[package]
name = "oak-core"
version.workspace = true
edition = "2021"
description = "Rust value types mirroring oakcore (Rational, TimeRange, format enums)"
license = "GPL-3.0-or-later"

[lib]
crate-type = ["rlib"]

[dependencies]
thiserror = "2.0.20"
ocio-rs = { version = "0.2", features = ["bundled"] }
# wgpu: portable GPU backend — same major as oak-render's shaderfx/naga
# generation (29, matching the gpui_wgpu device the app presents with, so
# the render thread's textures are directly sampleable by the UI).
wgpu = "29"
log = "0.4.34"
# half: f16↔f32 conversion for format-aware texture downloads (the M2
# present target is Rgba16Float; the rest of the pipeline is Rgba32Float).
half = "2"
# TOML persistence for the application config (configstore.rs).
toml = "0.8"
# XML helpers (xmlutils.rs).
quick-xml = "0.41.0"
# Pure-Rust image I/O for oiioutils.rs (TIFF only — the only format current
# callers need).
image = { version = "0.25", default-features = false, features = ["tiff"] }
