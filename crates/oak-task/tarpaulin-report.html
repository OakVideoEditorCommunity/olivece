 \".otio, .fcpxml\";\n\nimpl InterchangeFormat {\n\t/// Dispatch on a filename's extension (case-insensitive).\n\t///\n\t/// `foo.OTIO` and `foo.FcpXml` select the same format as `foo.otio` /\n\t/// `foo.fcpxml`; any other extension (or a filename without one) is\n\t/// `Error::Failed` with a message naming the supported extensions.\n\tpub fn of(filename: \u0026str) -\u003e Result\u003cInterchangeFormat\u003e {\n\t\tlet ext = Path::new(filename)\n\t\t\t.extension()\n\t\t\t.map(|e| e.to_string_lossy().into_owned())\n\t\t\t.unwrap_or_default();\n\t\tmatch ext.to_ascii_lowercase().as_str() {\n\t\t\t\"otio\" =\u003e Ok(InterchangeFormat::OtioJson),\n\t\t\t\"fcpxml\" =\u003e Ok(InterchangeFormat::Fcpxml),\n\t\t\t_ =\u003e Err(Error::Failed(format!(\n\t\t\t\t\"Unknown project file format for \\\"{filename}\\\" (supported: {SUPPORTED_EXTENSIONS})\"\n\t\t\t))),\n\t\t}\n\t}\n}\n","traces":[{"line":52,"address":[],"length":0,"stats":{"Line":33}},{"line":53,"address":[],"length":0,"stats":{"Line":66}},{"line":55,"address":[],"length":0,"stats":{"Line":132}},{"line":57,"address":[],"length":0,"stats":{"Line":33}},{"line":58,"address":[],"length":0,"stats":{"Line":56}},{"line":59,"address":[],"length":0,"stats":{"Line":18}},{"line":60,"address":[],"length":0,"stats":{"Line":2}},{"line":61,"address":[],"length":0,"stats":{"Line":2}}],"covered":8,"coverable":8},{"path":["/","Users","sunyu","Projects","oak","src","task","rust","src","project","import.rs"],"content":"// Oak Video Editor - Non-Linear Video Editor\n// Copyright (C) 2026 Oak Team\n//\n// This program is free software: you can redistribute it and/or modify\n// it under the terms of the GNU General Public License as published by\n// the Free Software Foundation, either version 3 of the License, or\n// (at your option) any later version.\n//\n// This program is distributed in the hope that it will be useful,\n// but WITHOUT ANY WARRANTY; without even the implied warranty of\n// MERCHANTABILITY or FITNESS FOR A PARTICULAR PURPOSE.  See the\n// GNU General Public License for more details.\n//\n// You should have received a copy of the GNU General Public License\n// along with this program.  If not, see \u003chttp://www.gnu.org/licenses/\u003e.\n\n//! `ProjectImportTask`, mirroring `src/task/src/project/import/import.h`.\n//!\n//! Imports media files into a folder of a project. Produces an undoable\n//! `OakUndoCommand` (taken via `take_command()`), tracks per-file import\n//! failures, and supports an optional image-sequence confirmation callback.\n//!\n//! CPP-PARITY: src/task/src/project/import/import.h\n\nuse std::path::Path;\n\nuse crate::bridge;\nuse crate::error::{Error, Result};\nuse crate::ffi::taskhandle::cstr;\nuse crate::handle::CHandle;\nuse crate::task::{Task, TaskBehavior};\n\n/// Callback used to confirm whether a detected image sequence should be\n/// imported as a sequence rather than individual frames, mirroring\n/// `ImageSequenceConfirmFn` in import.h.\npub type ImageSequenceConfirmFn = Box\u003cdyn FnMut(\u0026str, \u0026str) -\u003e bool + Send\u003e;\n\n/// A project-import task. Borrows the destination folder and project.\npub struct ProjectImportTask {\n\t/// The shared task base.\n\tpub base: Task,\n\t/// Destination folder (borrowed `OakNodeFolder`).\n\tpub folder: CHandle,\n\t/// Destination project (borrowed `OakNodeProject`).\n\tpub project: CHandle,\n\t/// Media filenames to import.\n\tpub filenames: Vec\u003cString\u003e,\n\t/// The undo command produced by the task, taken via `take_command`.\n\tcommand: Option\u003cCHandle\u003e,\n\t/// Files that failed to import.\n\tinvalid_files: Vec\u003cString\u003e,\n\t/// Imported footage, taken via `get_imported_footage`.\n\timported_footage: Vec\u003cCHandle\u003e,\n\t/// Optional image-sequence confirmation callback.\n\timage_sequence_confirm: Option\u003cImageSequenceConfirmFn\u003e,\n\t/// Total number of files to import (directories counted recursively).\n\tfile_count: usize,\n\t/// Image-sequence files already decided not to be imported as sequences.\n\timage_sequence_ignore_files: Vec\u003cString\u003e,\n}\n\nimpl Drop for ProjectImportTask {\n\tfn drop(\u0026mut self) {\n\t\tif let Some(command) = \u0026mut self.command {\n\t\t\tif !command.ctx.is_null() {\n\t\t\t\tunsafe {\n\t\t\t\t\tbridge::undo::oakundo_command_free(command);\n\t\t\t\t}\n\t\t\t}\n\t\t}\n\t\t// Borrowed footage handles: releasing them only frees the handle\n\t\t// boxes (the footage nodes are owned by the project).\n\t\tfor footage in \u0026self.imported_footage {\n\t\t\tif !footage.ctx.is_null() {\n\t\t\t\tif let Some(release) = footage.release {\n\t\t\t\t\tunsafe {\n\t\t\t\t\t\trelease(footage.ctx);\n\t\t\t\t\t}\n\t\t\t\t}\n\t\t\t}\n\t\t}\n\t}\n}\n\nimpl ProjectImportTask {\n\t/// Create an import task for the given folder/project and filenames.\n\tpub fn new(\n\t\tbase: Task,\n\t\tfolder: CHandle,\n\t\tproject: CHandle,\n\t\tfilenames: Vec\u003cString\u003e,\n\t\timage_sequence_confirm: Option\u003cImageSequenceConfirmFn\u003e,\n\t\tfile_count: usize,\n\t) -\u003e ProjectImportTask {\n\t\tProjectImportTask {\n\t\t\tbase,\n\t\t\tfolder,\n\t\t\tproject,\n\t\t\tfilenames,\n\t\t\tcommand: None,\n\t\t\tinvalid_files: Vec::new(),\n\t\t\timported_footage: Vec::new(),\n\t\t\timage_sequence_confirm,\n\t\t\tfile_count,\n\t\t\timage_sequence_ignore_files: Vec::new(),\n\t\t}\n\t}\n\n\t/// Take ownership of the produced undo command; `Err(Error::State)` if\n\t/// the task has not run yet.\n\tpub fn take_command(\u0026mut self) -\u003e Result\u003cCHandle\u003e {\n\t\tself.command.take().ok_or(Error::State)\n\t}\n\n\t/// Number of files that failed to import.\n\tpub fn get_invalid_file_count(\u0026self) -\u003e usize {\n\t\tself.invalid_files.len()\n\t}\n\n\t/// Whether any file failed to import.\n\tpub fn has_invalid_files(\u0026self) -\u003e bool {\n\t\t!self.invalid_files.is_empty()\n\t}\n\n\t/// Borrowed handle to the imported footage at `index` (addref'd by the C\n\t/// ABI); `Err(Error::NotFound)` if out of range.\n\tpub fn get_imported_footage(\u0026self, index: usize) -\u003e Result\u003cCHandle\u003e {\n\t\tlet footage = self.imported_footage.get(index).ok_or(Error::NotFound)?;\n\t\tif !footage.ctx.is_null() {\n\t\t\tif let Some(addref) = footage.addref {\n\t\t\t\tunsafe {\n\t\t\t\t\taddref(footage.ctx);\n\t\t\t\t}\n\t\t\t}\n\t\t}\n\t\tOk(*footage)\n\t}\n\n\t/// Total number of imported footage entries.\n\tpub fn get_file_count(\u0026self) -\u003e usize {\n\t\tself.imported_footage.len()\n\t}\n\n\t/// Set the image-sequence confirmation callback.\n\tpub fn set_image_sequence_confirm_callback(\u0026mut self, cb: ImageSequenceConfirmFn) {\n\t\tself.image_sequence_confirm = Some(cb);\n\t}\n\n\t/// The number of files counted at construction (progress denominator).\n\tpub fn file_count(\u0026self) -\u003e usize {\n\t\tself.file_count\n\t}\n\n\t/// The invalid filename at `index` (assumes the index is in range).\n\tpub(crate) fn invalid_file_at(\u0026self, index: usize) -\u003e \u0026str {\n\t\t\u0026self.invalid_files[index]\n\t}\n\n\tfn import(\u0026mut self, task: \u0026mut Task, folder: CHandle, entries: \u0026mut Vec\u003cString\u003e, counter: \u0026mut usize, parent_command: CHandle) {\n\t\tlet mut i = 0;\n\t\twhile i \u003c entries.len() {\n\t\t\tif task.is_cancelled() {\n\t\t\t\tbreak;\n\t\t\t}\n\n\t\t\tlet file_path = \u0026entries[i];\n\n\t\t\tif Path::new(file_path).is_dir() {\n\t\t\t\t// Create a folder corresponding to the directory and recurse.\n\t\t\t\tlet entry_list: Vec\u003cString\u003e = match std::fs::read_dir(file_path) {\n\t\t\t\t\tOk(rd) =\u003e rd\n\t\t\t\t\t\t.filter_map(|e| e.ok())\n\t\t\t\t\t\t.map(|e| e.path().to_string_lossy().into_owned())\n\t\t\t\t\t\t.collect(),\n\t\t\t\t\tErr(_) =\u003e Vec::new(),\n\t\t\t\t};\n\n\t\t\t\tif !entry_list.is_empty() {\n\t\t\t\t\tlet folder_handle = unsafe { bridge::node::oaknode_folder_create(self.project) };\n\t\t\t\t\tif !folder_handle.ctx.is_null() {\n\t\t\t\t\t\tunsafe {\n\t\t\t\t\t\t\tbridge::node::oaknode_node_set_label(\n\t\t\t\t\t\t\t\tbridge::node::oaknode_folder_as_node(folder_handle),\n\t\t\t\t\t\t\t\tcstr(\u0026basename_of(file_path)),\n\t\t\t\t\t\t\t);\n\t\t\t\t\t\t}\n\t\t\t\t\t\tself.add_item_to_folder(folder, unsafe { bridge::node::oaknode_folder_as_node(folder_handle) }, parent_command);\n\t\t\t\t\t\tlet mut sub_entries = entry_list;\n\t\t\t\t\t\tself.import(task, folder_handle, \u0026mut sub_entries, counter, parent_command);\n\t\t\t\t\t}\n\t\t\t\t}\n\t\t\t} else {\n\t\t\t\tlet footage = unsafe { bridge::node::oaknode_footage_create(self.project, std::ptr::null()) };\n\t\t\t\tif footage.ctx.is_null() {\n\t\t\t\t\ti += 1;\n\t\t\t\t\tcontinue;\n\t\t\t\t}\n\n\t\t\t\tunsafe {\n\t\t\t\t\tbridge::node::oaknode_footage_set_cancel_atom(footage, bridge::render::OakCancelAtom::from_chandle(task.get_cancel_atom()));\n\t\t\t\t}\n\t\t\t\tlet ok = unsafe { bridge::node::oaknode_footage_set_filename(footage, cstr(file_path)) } == 0;\n\t\t\t\tunsafe {\n\t\t\t\t\tbridge::node::oaknode_footage_set_cancel_atom(footage, bridge::render::OakCancelAtom::null());\n\t\t\t\t}\n\n\t\t\t\tif ok \u0026\u0026 unsafe { bridge::node::oaknode_footage_is_valid(footage) } != 0 {\n\t\t\t\t\tunsafe {\n\t\t\t\t\t\tbridge::node::oaknode_node_set_label(bridge::node::oaknode_footage_as_node(footage), cstr(\u0026basename_of(file_path)));\n\t\t\t\t\t}\n\n\t\t\t\t\t// See if this footage is an image sequence.\n\t\t\t\t\tself.validate_image_sequence(task, footage, entries, i);\n\n\t\t\t\t\t// Create the undoable command that adds the item.\n\t\t\t\t\tself.add_item_to_folder(folder, unsafe { bridge::node::oaknode_footage_as_node(footage) }, parent_command);\n\n\t\t\t\t\tself.imported_footage.push(footage);\n\t\t\t\t} else {\n\t\t\t\t\tself.invalid_files.push(file_path.clone());\n\n\t\t\t\t\t// Remove the invalid footage from the graph; the remove\n\t\t\t\t\t// command takes ownership on redo and deletes the node\n\t\t\t\t\t// when the command is destroyed.\n\t\t\t\t\tlet mut remove = unsafe { bridge::node::oaknode_command_create_remove_node(bridge::node::oaknode_footage_as_node(footage)) };\n\t\t\t\t\tif !remove.ctx.is_null() {\n\t\t\t\t\t\tunsafe {\n\t\t\t\t\t\t\tbridge::undo::oakundo_command_redo_now(remove);\n\t\t\t\t\t\t\tbridge::undo::oakundo_command_free(\u0026mut remove);\n\t\t\t\t\t\t}\n\t\t\t\t\t}\n\t\t\t\t}\n\n\t\t\t\t*counter += 1;\n\t\t\t\ttask.emit_progress(*counter as f64 / self.file_count.max(1) as f64);\n\t\t\t}\n\t\t\ti += 1;\n\t\t}\n\t}\n\n\tfn add_item_to_folder(\u0026self, folder: CHandle, item: CHandle, command: CHandle) {\n\t\tlet child = unsafe { bridge::node::oaknode_command_create_folder_add_child(folder, item) };\n\t\tif !child.ctx.is_null() {\n\t\t\tunsafe {\n\t\t\t\tbridge::undo::oakundo_command_multi_add_child(command, child);\n\t\t\t}\n\t\t}\n\t}\n\n\tfn validate_image_sequence(\u0026mut self, task: \u0026mut Task, footage: CHandle, info_list: \u0026mut Vec\u003cString\u003e, index: usize) {\n\t\tlet filename = footage_filename(footage);\n\t\tif filename.is_empty() {\n\t\t\treturn;\n\t\t}\n\n\t\tlet digit_count = unsafe { bridge::codec::oakcodec_decoder_get_image_sequence_digit_count(cstr(\u0026filename)) };\n\t\tif digit_count \u003c= 0 {\n\t\t\treturn;\n\t\t}\n\n\t\tif self.image_sequence_ignore_files.iter().any(|f| f == \u0026filename) {\n\t\t\treturn;\n\t\t}\n\n\t\tif !self.item_is_still_image_footage_only(footage) {\n\t\t\treturn;\n\t\t}\n\n\t\tlet mut video_stream = CHandle::null();\n\t\tif unsafe { bridge::node::oaknode_footage_get_video_params(footage, 0, \u0026mut video_stream) } != 0 {\n\t\t\treturn;\n\t\t}\n\n\t\tlet mut width = 0;\n\t\tlet mut height = 0;\n\t\tunsafe {\n\t\t\tbridge::common::oak_core_videoparams_get_width(video_stream, \u0026mut width);\n\t\t\tbridge::common::oak_core_videoparams_get_height(video_stream, \u0026mut height);\n\t\t}\n\n\t\tlet seq_index = unsafe { bridge::codec::oakcodec_decoder_get_image_sequence_index(cstr(\u0026filename)) };\n\n\t\tlet prev_fn = transform_sequence_filename(\u0026filename, seq_index - 1, digit_count);\n\t\tlet next_fn = transform_sequence_filename(\u0026filename, seq_index + 1, digit_count);\n\n\t\tlet previous_file = unsafe { bridge::node::oaknode_footage_create(self.project, cstr(\u0026prev_fn)) };\n\t\tlet next_file = unsafe { bridge::node::oaknode_footage_create(self.project, cstr(\u0026next_fn)) };\n\n\t\tlet prev_matches = !previous_file.ctx.is_null()\n\t\t\t\u0026\u0026 unsafe { bridge::node::oaknode_footage_is_valid(previous_file) } != 0\n\t\t\t\u0026\u0026 self.compare_still_image_size(previous_file, width, height);\n\t\tlet next_matches = !next_file.ctx.is_null()\n\t\t\t\u0026\u0026 unsafe { bridge::node::oaknode_footage_is_valid(next_file) } != 0\n\t\t\t\u0026\u0026 self.compare_still_image_size(next_file, width, height);\n\n\t\tif prev_matches || next_matches {\n\t\t\t// Ask the user whether this is really a sequence (default: no).\n\t\t\tlet is_sequence = match self.image_sequence_confirm.as_mut() {\n\t\t\t\tSome(cb) =\u003e cb(\u0026filename, \u0026filename),\n\t\t\t\tNone =\u003e false,\n\t\t\t};\n\n\t\t\tlet start_index = get_image_sequence_limit(\u0026filename, seq_index, false, digit_count);\n\t\t\tlet end_index = get_image_sequence_limit(\u0026filename, seq_index, true, digit_count);\n\n\t\t\tfor j in start_index..=end_index {\n\t\t\t\tlet entry_fn = transform_sequence_filename(\u0026filename, j, digit_count);\n\n\t\t\t\tif is_sequence {\n\t\t\t\t\t// Remove later entries of this sequence from the import\n\t\t\t\t\t// list (they are imported as one footage). The C++\n\t\t\t\t\t// `info_list.size()` is re-evaluated after each erase.\n\t\t\t\t\tlet mut k = index + 1;\n\t\t\t\t\twhile k \u003c info_list.len() {\n\t\t\t\t\t\tif info_list[k] == entry_fn {\n\t\t\t\t\t\t\tinfo_list.remove(k);\n\t\t\t\t\t\t\tbreak;\n\t\t\t\t\t\t}\n\t\t\t\t\t\tk += 1;\n\t\t\t\t\t}\n\t\t\t\t} else {\n\t\t\t\t\tself.image_sequence_ignore_files.push(entry_fn);\n\t\t\t\t}\n\t\t\t}\n\n\t\t\tif is_sequence {\n\t\t\t\tunsafe {\n\t\t\ me and produces the project on `take_project()`; `ProjectLoadTask`\n//! is the concrete (OTIO-less) loader.\n//!\n//! CPP-PARITY: src/task/src/project/load/load.h\n\nuse crate::bridge;\nuse crate::error::{Error, Result};\nuse crate::ffi::taskhandle::cstr;\nuse crate::handle::CHandle;\nuse crate::task::{Task, TaskBehavior};\n\n/// Serializer result codes (`include/node/serializer.h`).\nconst OAKNODE_SERIALIZER_RESULT_SUCCESS: i32 = 0;\nconst OAKNODE_SERIALIZER_RESULT_PROJECT_TOO_OLD: i32 = 1;\nconst OAKNODE_SERIALIZER_RESULT_PROJECT_TOO_NEW: i32 = 2;\nconst OAKNODE_SERIALIZER_RESULT_UNKNOWN_VERSION: i32 = 3;\nconst OAKNODE_SERIALIZER_RESULT_FILE_ERROR: i32 = 4;\nconst OAKNODE_SERIALIZER_RESULT_XML_ERROR: i32 = 5;\nconst OAKNODE_SERIALIZER_RESULT_NO_DATA: i32 = 7;\n\n/// The base project-load task: owns a source filename and yields a loaded\n/// project via [`ProjectLoadBaseTask::take_project`].\npub struct ProjectLoadBaseTask {\n\t/// The shared task base.\n\tpub base: Task,\n\t/// Absolute project filename to load.\n\tpub filename: String,\n\t/// The loaded project, produced by the task and taken via `take_project`.\n\tloaded_project: Option\u003cCHandle\u003e,\n}\n\nimpl Drop for ProjectLoadBaseTask {\n\tfn drop(\u0026mut self) {\n\t\t// Free the loaded project if it was never taken.\n\t\tif let Some(project) = \u0026mut self.loaded_project {\n\t\t\tif !project.ctx.is_null() {\n\t\t\t\tunsafe {\n\t\t\t\t\tbridge::node::oaknode_project_free(project);\n\t\t\t\t}\n\t\t\t}\n\t\t}\n\t}\n}\n\nimpl ProjectLoadBaseTask {\n\t/// Create a base load task for the given filename.\n\tpub fn new(base: Task, filename: String) -\u003e ProjectLoadBaseTask {\n\t\tProjectLoadBaseTask {\n\t\t\tbase,\n\t\t\tfilename,\n\t\t\tloaded_project: None,\n\t\t}\n\t}\n\n\t/// Take ownership of the loaded project. Returns `Err(Error::State)` if\n\t/// the task has not loaded a project yet.\n\tpub fn take_project(\u0026mut self) -\u003e Result\u003cCHandle\u003e {\n\t\tself.loaded_project.take().ok_or(Error::State)\n\t}\n\n\t/// Store the loaded project (called by `run`).\n\tpub(crate) fn store_project(\u0026mut self, project: CHandle) {\n\t\tself.loaded_project = Some(project);\n\t}\n}\n\nimpl TaskBehavior for ProjectLoadBaseTask {\n\t/// Load the project from `filename` via the oaknode serializer\n\t/// (`bridge::node`), storing the resulting `OakNodeProject`.\n\tfn run(\u0026mut self, task: \u0026mut Task) -\u003e Result\u003c()\u003e {\n\t\tlet mut project = unsafe { bridge::node::oaknode_project_init() };\n\t\tif project.ctx.is_null() {\n\t\t\ttask.set_error(\"Failed to create project\");\n\t\t\treturn Err(Error::Failed(\"Failed to create project\".to_string()));\n\t\t}\n\n\t\tunsafe {\n\t\t\tbridge::node::oaknode_project_set_filename(project, cstr(\u0026self.filename));\n\t\t}\n\n\t\tlet mut code = OAKNODE_SERIALIZER_RESULT_FILE_ERROR;\n\t\tlet mut details = [0i8; 512];\n\t\tlet result = unsafe {\n\t\t\tbridge::node::oaknode_serializer_load_from_file(\n\t\t\t\tproject,\n\t\t\t\tcstr(\u0026self.filename),\n\t\t\t\t\u0026mut code,\n\t\t\t\tdetails.as_mut_ptr(),\n\t\t\t\tdetails.len() as i32,\n\t\t\t)\n\t\t};\n\n\t\tlet mut success = false;\n\t\tmatch code {\n\t\t\tOAKNODE_SERIALIZER_RESULT_SUCCESS =\u003e success = true,\n\t\t\tOAKNODE_SERIALIZER_RESULT_PROJECT_TOO_OLD =\u003e {\n\t\t\t\ttask.set_error(\"This project is from a version of Oak Video Editor that is no longer supported in this version.\");\n\t\t\t}\n\t\t\tOAKNODE_SERIALIZER_RESULT_PROJECT_TOO_NEW =\u003e {\n\t\t\t\ttask.set_error(\"This project is from a newer version of Oak Video Editor and cannot be opened in this version.\");\n\t\t\t}\n\t\t\tOAKNODE_SERIALIZER_RESULT_UNKNOWN_VERSION =\u003e {\n\t\t\t\ttask.set_error(\"Failed to determine project version.\");\n\t\t\t}\n\t\t\tOAKNODE_SERIALIZER_RESULT_FILE_ERROR =\u003e {\n\t\t\t\ttask.set_error(\u0026format!(\"Failed to read file \\\"{}\\\" for reading.\", self.filename));\n\t\t\t}\n\t\t\tOAKNODE_SERIALIZER_RESULT_XML_ERROR =\u003e {\n\t\t\t\ttask.set_error(\u0026format!(\n\t\t\t\t\t\"Failed to read XML document. File may be corrupt. Error was: {}\",\n\t\t\t\t\tbuf_to_string(\u0026details)\n\t\t\t\t));\n\t\t\t}\n\t\t\tOAKNODE_SERIALIZER_RESULT_NO_DATA =\u003e {\n\t\t\t\ttask.set_error(\"Failed to find any data to parse.\");\n\t\t\t}\n\t\t\t_ =\u003e task.set_error(\"Unknown error.\"),\n\t\t}\n\n\t\tif result == 0 \u0026\u0026 success {\n\t\t\tself.store_project(project);\n\t\t\treturn Ok(());\n\t\t}\n\n\t\tif !project.ctx.is_null() {\n\t\t\tunsafe {\n\t\t\t\tbridge::node::oaknode_project_free(\u0026mut project);\n\t\t\t}\n\t\t}\n\t\tErr(Error::Failed(\"Failed to load project\".to_string()))\n\t}\n}\n\n/// The concrete native project loader (no OTIO path).\npub struct ProjectLoadTask {\n\t/// The shared task base.\n\tpub base: ProjectLoadBaseTask,\n}\n\nimpl TaskBehavior for ProjectLoadTask {\n\tfn run(\u0026mut self, task: \u0026mut Task) -\u003e Result\u003c()\u003e {\n\t\t\u003cProjectLoadBaseTask as TaskBehavior\u003e::run(\u0026mut self.base, task)\n\t}\n}\n\n/// Read a NUL-terminated char buffer into a String (lossy).\npub(crate) fn buf_to_string(buf: \u0026[i8]) -\u003e String {\n\tlet len = buf.iter().position(|\u0026c| c == 0).unwrap_or(buf.len());\n\tunsafe { String::from_utf8_lossy(std::slice::from_raw_parts(buf.as_ptr() as *const u8, len)).into_owned() }\n}\n","traces":[{"line":53,"address":[],"length":0,"stats":{"Line":22}},{"line":55,"address":[],"length":0,"stats":{"Line":23}},{"line":56,"address":[],"length":0,"stats":{"Line":1}},{"line":58,"address":[],"length":0,"stats":{"Line":1}},{"line":67,"address":[],"length":0,"stats":{"Line":22}},{"line":77,"address":[],"length":0,"stats":{"Line":23}},{"line":78,"address":[],"length":0,"stats":{"Line":92}},{"line":82,"address":[],"length":0,"stats":{"Line":14}},{"line":83,"address":[],"length":0,"stats":{"Line":14}},{"line":90,"address":[],"length":0,"stats":{"Line":2}},{"line":91,"address":[],"length":0,"stats":{"Line":4}},{"line":92,"address" ct::format::InterchangeFormat;\nuse crate::project::load::ProjectLoadBaseTask;\nuse crate::task::{Task, TaskBehavior};\n\n/// Callback used to confirm whether the sequences of an OTIO document should\n/// be imported, mirroring `ImportConfirmFn` in loadotio.h (receives the\n/// sequence labels in order; return true to accept).\npub type ImportConfirmFn = Box\u003cdyn FnMut(\u0026[String]) -\u003e bool + Send\u003e;\n\n/// Global import-confirmation callback, mirroring the C++ static\n/// `LoadOTIOTask::confirm_callback_` (loadotio.h). When unset, everything is\n/// imported (the headless default).\nstatic CONFIRM_CALLBACK: Mutex\u003cOption\u003cImportConfirmFn\u003e\u003e = Mutex::new(None);\n\n/// Register (or clear, with `None`) the global import-confirmation callback.\n///\n/// CPP-PARITY: src/task/src/project/loadotio/loadotio.h\n///   (`LoadOTIOTask::set_import_confirm_callback`)\npub fn set_import_confirm_callback(cb: Option\u003cImportConfirmFn\u003e) {\n\t*CONFIRM_CALLBACK.lock().unwrap() = cb;\n}\n\n/// An OTIO project loader.\npub struct LoadOTIOTask {\n\t/// The base load task (owns the filename and yields the project).\n\tpub base: ProjectLoadBaseTask,\n}\n\nimpl LoadOTIOTask {\n\t/// Create an OTIO loader for the given base load task.\n\tpub fn new(base: ProjectLoadBaseTask) -\u003e LoadOTIOTask {\n\t\tLoadOTIOTask { base }\n\t}\n}\n\nimpl TaskBehavior for LoadOTIOTask {\n\t/// Load and parse the document (`oakotio`), then convert it into the\n\t/// project stored on the base task.\n\tfn run(\u0026mut self, task: \u0026mut Task) -\u003e Result\u003c()\u003e {\n\t\t// Dispatch the interchange format from the filename extension.\n\t\t// Format handling ends here: `parse_timelines` returns one\n\t\t// `oakotio::Timeline` per sequence whatever the source format, so\n\t\t// the project building below is shared between `.otio` and\n\t\t// `.fcpxml` (C++ parity for the track/clip/footage code).\n\t\tlet format = match InterchangeFormat::of(\u0026self.base.filename) {\n\t\t\tOk(f) =\u003e f,\n\t\t\tErr(e) =\u003e {\n\t\t\t\tif let Error::Failed(msg) = \u0026e {\n\t\t\t\t\ttask.set_error(msg);\n\t\t\t\t}\n\t\t\t\treturn Err(e);\n\t\t\t}\n\t\t};\n\n\t\tlet timelines = parse_timelines(task, \u0026self.base.filename, format)?;\n\n\t\tlet mut project = unsafe { bridge::node::oaknode_project_init() };\n\t\tif project.ctx.is_null() {\n\t\t\ttask.set_error(\"Failed to create project\");\n\t\t\treturn Err(Error::Failed(\"Failed to create project\".to_string()));\n\t\t}\n\t\tunsafe {\n\t\t\tbridge::node::oaknode_project_initialize(project);\n\t\t\tbridge::node::oaknode_project_set_modified(project, 1);\n\t\t}\n\n\t\t// Keep track of imported footage\n\t\tlet mut imported_footage: HashMap\u003cString, CHandle\u003e = HashMap::new();\n\n\t\t// Generate a list of sequences with the same names as the timelines.\n\t\t// Assumes each timeline has a unique name.\n\t\tlet mut unnamed_sequence_count = 0;\n\t\tlet mut sequences: Vec\u003cCHandle\u003e = Vec::new();\n\n\t\t// Variables used for loading bar\n\t\tlet mut number_of_clips: f64 = 0.0;\n\n\t\tfor timeline in \u0026timelines {\n\t\t\tlet sequence = unsafe { bridge::node::oaknode_sequence_create() };\n\t\t\tif sequence.ctx.is_null() {\n\t\t\t\tcontinue;\n\t\t\t}\n\n\t\t\tlet label = if !timeline.name().is_empty() {\n\t\t\t\ttimeline.name().to_string()\n\t\t\t} else {\n\t\t\t\t// If the otio timeline does not provide a name, create a\n\t\t\t\t// default one here.\n\t\t\t\tunnamed_sequence_count += 1;\n\t\t\t\tformat!(\"Sequence {unnamed_sequence_count}\")\n\t\t\t};\n\t\t\tunsafe {\n\t\t\t\tbridge::node::oaknode_node_set_label(bridge::node::oaknode_sequence_as_node(sequence), cstr(\u0026label));\n\t\t\t}\n\n\t\t\t// Set default params incase they aren't edited.\n\t\t\tunsafe {\n\t\t\t\tbridge::node::oaknode_sequence_set_default_parameters(sequence);\n\t\t\t}\n\n\t\t\t// Get number of clips for loading bar\n\t\t\tfor track in timeline.tracks().children() {\n\t\t\t\tif let Some(otio_track) = track.as_track() {\n\t\t\t\t\tnumber_of_clips += otio_track.children().len() as f64;\n\t\t\t\t}\n\t\t\t}\n\n\t\t\tsequences.push(sequence);\n\t\t}\n\t\tif number_of_clips \u003c= 0.0 {\n\t\t\tnumber_of_clips = 1.0;\n\t\t}\n\n\t\t// Ask the user which sequences to import (facade callback; headless\n\t\t// default accepts everything).\n\t\tlet sequence_names: Vec\u003cString\u003e = sequences\n\t\t\t.iter()\n\t\t\t.map(|s| node_label_of(unsafe { bridge::node::oaknode_sequence_as_node(*s) }))\n\t\t\t.collect();\n\t\tlet mut confirm = CONFIRM_CALLBACK.lock().unwrap().take();\n\t\tlet accepted = match confirm.as_mut() {\n\t\t\tSome(cb) =\u003e cb(\u0026sequence_names),\n\t\t\tNone =\u003e true,\n\t\t};\n\n\t\tif !accepted {\n\t\t\t// Cancel to indicate to caller that this task did not complete\n\t\t\t// and to simply dispose of it. The project is never handed to the\n\t\t\t// base task, so free it here (the C++ base-task destructor does\n\t\t\t// the same).\n\t\t\ttask.cancel();\n\t\t\tfor sequence in \u0026mut sequences {\n\t\t\t\tunsafe {\n\t\t\t\t\tbridge::node::oaknode_sequence_free(sequence);\n\t\t\t\t}\n\t\t\t}\n\t\t\tif !project.ctx.is_null() {\n\t\t\t\tunsafe {\n\t\t\t\t\tbridge::node::oaknode_project_free(\u0026mut project);\n\t\t\t\t}\n\t\t\t}\n\t\t\treturn Ok(());\n\t\t}\n\n\t\tlet root_folder = unsafe { bridge::node::oaknode_project_root(project) };\n\t\tlet mut clips_done = 0.0f64;\n\n\t\tfor (timeline, sequence) in timelines.iter().zip(\u0026sequences) {\n\t\t\tlet sequence_node = unsafe { bridge::node::oaknode_sequence_as_node(*sequence) };\n\n\t\t\tunsafe {\n\t\t\t\tbridge::node::oaknode_project_add_node(project, sequence_node);\n\t\t\t}\n\t\t\tlet mut add_seq = unsafe { bridge::node::oaknode_command_create_folder_add_child(root_folder, sequence_node) };\n\t\t\tif !add_seq.ctx.is_null() {\n\t\t\t\tunsafe {\n\t\t\t\t\tbridge::undo::oakundo_command_redo_now(add_seq);\n\t\t\t\t\tbridge::undo::oakundo_command_free(\u0026mut add_seq);\n\t\t\t\t}\n\t\t\t}\n\n\t\t\t// Create a folder for this sequence's footage\n\t\t\tlet sequence_footage = unsafe { bridge::node::oaknode_folder_create(project) };\n\t\t\tif !sequence_footage.ctx.is_null() {\n\t\t\t\tunsafe {\n\t\t\t\t\tbridge::node::oaknode_node_set_label(\n\t\t\t\t\t\tbridge::node::oaknode_folder_as_node(sequence_footage),\n\t\t\t\t\t\tcstr(timeline.name()),\n\t\t\t\t\t);\n\t\t\t\t}\n\t\t\t\tlet mut add_folder = unsafe {\n\t\t\t\t\tbridge::node::oaknode_command_create_folder_add_child(\n\t\t\t\t\t\troot_folder,\n\t\t\t\t\t\tbridge::node::oaknode_folder_as_node(sequence_footage),\n\t\t\t\t\t)\n\t\t\t\t};\n\t\t\t\tif !add_folder.ctx.is_null() {\n\t\t\t\t\tunsafe {\n\t\t\t\t\t\tbridge::undo::oakundo_command_redo_now(add_folder);\n\t\t\t\t\t\tbridge::undo::oakundo_command_free(\u0026mut add_folder);\n\t\t\t\t\t}\n\t\t\t\t}\n\t\t\t}\n\n\t\t\t// Iterate through tracks\n\t\t\tfor track_composable in timeline.tracks().children() {\n\t\t\t\tlet Some(otio_track) = track_composable.as_track() else {\n\t\t\t\t\tcontinue;\n\t\t\t\t};\n\n\t\t\t\t// Determine what kind of track it is\n\t\t\t\tlet track_type = match otio_track.kind() {\n\t\t\t\t\t\"Video\" =\u003e bridge::node::OAKNODE_TRACK_TYPE_VIDEO,\n\t\t\t\t\t\"Audio\" =\u003e bridge::node::OAKNODE_TRACK_TYPE_AUDIO,\n\t\t\t\t\tother =\u003e {\n\t\t\t\t\t\teprintln!(\"Found unknown track type: {other}\");\n\t\t\t\t\t\tcontinue;\n\t\t\t\t\t}\n\t\t\t\t};\n\n\t\t\t\t// Create a new track\n\t\t\t\tlet mut track_list = CHandle::null();\n\t\t\t\tunsafe {\n\t\t\t\t\tbridge::node::oaknode_sequence_get_track_list(*sequence, track_type, \u0026mut track_list);\n\t\t\t\t}\n\t\t\t\tlet mut add_track = unsafe { bridge::timeline::oaktimeline_add_track_command(track_list) };\n\t\t\t\tif !add_track.ctx.is_null() {\n\t\t\t\t\tunsafe {\n\t\t\t\t\t\tbridge::undo::oakundo_command_redo_now(add_track);\n\t\t\t\t\t\tbridge::undo::oakundo_command_free(\u0026mut add_track);\n\t\t\t\t\t}\n\t\t\t\t}\n\n\t\t\t\tlet mut track = CHandle::null();\n\t\t\t\tlet mut count = 0;\n\t\t\t\tunsafe {\n\t\t\t\t\tbridge::node::oaknode_tracklist_get_track_count(track_list, \u0026mut count);\n\t\t\t\t}\n\t\t\t\tif count \u003e 0 {\n\t\t\t\t\tunsafe {\n\t\t\t\t\t\tbridge::node::oaknode_tracklist_get_track_at(track_list, count - 1, \u0026mut track);\n\t\t\t\t\t}\n\t\t\t\t}\n\t\t\t\tif track.ctx.is_null() {\n\t\t\t\t\tcontinue;\n\t\t\t\t}\n\n\t\t\t\t// Get clips from track\n\t\t\t\tlet mut previous_block = CHandle::null();\n\t\t\t\tlet mut prev_block_transition = false;\n\n\t\t\t\tfor otio_block in otio_track.children() {\n\t\t\t\t\tif task.is_cancelled() {\n\t\t\t\t\t\tbreak;\n\t\t\t\t\t}\n\n\t\t\t\t\tlet block = match otio_block.schema_name() {\n\t\t\t\t\t\t\"Clip\" =\u003e unsafe { bridge::node::oaknode_block_clip_create() },\n\t\t\t\t\t\t\"Gap\" =\u003e unsafe { bridge::node::oaknode_block_gap_create() },\n\t\t\t\t\t\t\"Transition\" =\u003e {\n\t\t\t\t\t\t\t// Todo: Look into OTIO supported transitions and add\n\t\t\t\t\t\t\t// them to Oak.\n\t\t\t\t\t\t\tunsafe {\n\t\t\t\t\t\t\t\tbridge::node::oaknode_block_transition_create(bridge::node::OAKNODE_TRANSITION_CROSS_DISSOLVE)\n\t\t\t\t\t\t\t}\n\t\t\t\t\t\t}\n\t\t\t\t\t\tother =\u003e {\n\t\t\t\t\t\t\t// We don't know what this is yet, just create a gap\n\t\t\t\t\t\t\t// for now so that *something* is there.\n\t\t\t\t\t\t\teprintln!(\"Found unknown block type: {other}\");\n\t\t\t\t\t\t\tunsafe { bridge::node::oaknode_block_gap_create() }\n\t\t\t\t\t\t}\n\t\t\t\t\t};\n\t\t\t\t\tif block.ctx.is_null() {\n\t\t\t\t\t\tcontinue;\n\t\t\t\t\t}\n\n\t\t\t\t\tlet block_node = unsafe { bridge::node::oaknode_block_as_node(block) };\n\t\t\t\t\tunsafe {\n\t\t\t\t\t\tbridge::node::oaknode_project_add_node(project, block_node);\n\t\t\t\t\t\tbridge::node::oaknode_node_set_label(block_node, cstr(otio_block.name()));\n\t\t\t\t\t\tbridge::node::oaknode_track_append_block(track, block);\n\t\t\t\t\t}\n\n\t\t\t\t\tif otio_block.schema_name() == \"Clip\" || otio_block.schema_name() == \"Gap\" {\n\t\t\t\t\t\ti oakproj` file via the\n//! oaknode serializer. Optionally writes to an override filename and/or uses\n//! compression.\n//!\n//! CPP-PARITY: src/task/src/project/save/save.h\n\nuse crate::bridge;\nuse crate::error::{Error, Result};\nuse crate::ffi::taskhandle::cstr;\nuse crate::handle::CHandle;\nuse crate::project::load::buf_to_string;\nuse crate::task::{Task, TaskBehavior};\n\n/// Serializer result codes (`include/node/serializer.h`).\nconst OAKNODE_SERIALIZER_RESULT_SUCCESS: i32 = 0;\nconst OAKNODE_SERIALIZER_RESULT_XML_ERROR: i32 = 5;\nconst OAKNODE_SERIALIZER_RESULT_FILE_ERROR: i32 = 4;\nconst OAKNODE_SERIALIZER_RESULT_OVERWRITE_ERROR: i32 = 6;\n\n/// A project-save task. Borrows its project and never takes ownership.\npub struct ProjectSaveTask {\n\t/// The shared task base.\n\tpub base: Task,\n\t/// Borrowed project to save (borrowed `OakNodeProject`).\n\tpub project: CHandle,\n\t/// Optional override filename; when empty the project's own filename is\n\t/// used.\n\tpub override_filename: Option\u003cString\u003e,\n\t/// Whether to compress the serialized output.\n\tpub use_compression: bool,\n}\n\nimpl ProjectSaveTask {\n\t/// Set the output filename override.\n\tpub fn set_override_filename(\u0026mut self, filename: \u0026str) {\n\t\tself.override_filename = Some(filename.to_string());\n\t}\n}\n\nimpl TaskBehavior for ProjectSaveTask {\n\t/// Serialize the project via the oaknode serializer (`bridge::node`) to\n\t/// the resolved filename.\n\tfn run(\u0026mut self, task: \u0026mut Task) -\u003e Result\u003c()\u003e {\n\t\tlet using_filename = match \u0026self.override_filename {\n\t\t\tSome(name) =\u003e name.clone(),\n\t\t\tNone =\u003e project_filename(self.project),\n\t\t};\n\n\t\tif using_filename.is_empty() {\n\t\t\ttask.set_error(\"Project has no filename to save to.\");\n\t\t\treturn Err(Error::Failed(\"Project has no filename to save to.\".to_string()));\n\t\t}\n\n\t\tlet mut code = OAKNODE_SERIALIZER_RESULT_FILE_ERROR;\n\t\tlet mut details = [0i8; Read, BufReader};\nuse std::process::{Command, Stdio};\n\nuse crate::bridge;\nuse crate::error::{Error, Result};\nuse crate::handle::CHandle;\nuse crate::task::{Task, TaskBehavior};\n\n/// The proxy parameters, mirroring `oakcodec_proxy_params` in\n/// `include/codec/proxy.h` (kept as plain fields so no oakcodec handle is\n/// needed to build arguments).\npub struct ProxyParams {\n\t/// Target width (0 = unspecified/divider-based).\n\tpub width: i32,\n\t/// Target height (0 = unspecified/divider-based).\n\tpub height: i32,\n\t/// Resolution divider.\n\tpub divider: i32,\n\t/// Proxy format version.\n\tpub version: i32,\n\t/// CRF for the proxy encode.\n\tpub crf: i32,\n\t/// Whether audio is included in the proxy.\n\tpub include_audio: bool,\n\t/// Output container extension.\n\tpub extension: String,\n\t/// ffmpeg preset name.\n\tpub preset: String,\n}\n\n/// A proxy transcode task: runs `ffmpeg` with arguments from\n/// [`ProxyTask::build_arguments`], parsing progress lines via\n/// [`ProxyTask::parse_progress`].\npub struct ProxyTask {\n\t/// The shared task base.\n\tpub base: Task,\n\t/// Source media filename.\n\tpub source_filename: String,\n\t/// Target stream index.\n\tpub stream_index: i32,\n\t/// Proxy parameters.\n\tpub params: ProxyParams,\n\t/// Output proxy filename.\n\tpub output_filename: String,\n\t/// Total media duration in seconds (for progress scaling).\n\tduration_seconds: f64,\n}\n\nimpl ProxyTask {\n\t/// Build a proxy task from an oakcodec request and proxy params,\n\t/// mirroring the C++ constructor (divider-based requests take the source\n\t/// fraction).\n\tpub fn new(request: \u0026bridge::codec::OakCodecTaskRequest, params: ProxyParams) -\u003e ProxyTask {\n\t\tlet source = unsafe { crate::ffi::taskhandle::cstr_to_string(request.input_filename) };\n\t\tlet output = unsafe { crate::ffi::taskhandle::cstr_to_string(request.output_filename) };\n\t\tlet mut params = params;\n\t\tif request.proxy_width \u003e 0 \u0026\u0026 request.proxy_height \u003e 0 {\n\t\t\tparams.width = request.proxy_width;\n\t\t\tparams.height = request.proxy_height;\n\t\t\tparams.divider = 1;\n\t\t}\n\t\tlet title = format!(\"Generating Proxy {}:{}\", source, request.stream_index);\n\t\tProxyTask {\n\t\t\tbase: Task::new(\u0026title, CHandle::null()),\n\t\t\tsource_filename: source,\n\t\t\tstream_index: request.stream_index,\n\t\t\tparams,\n\t\t\toutput_filename: output,\n\t\t\tduration_seconds: 0.0,\n\t\t}\n\t}\n\n\t/// Build the `ffmpeg` command-line argument vector for the proxy\n\t/// transcode. Mirrors `build_arguments` in proxy.cpp; the exact ordering\n\t/// and flag spelling are parity-locked (golden test).\n\t///\n\t/// CPP-PARITY: src/task/src/proxy/proxy.cpp (build_arguments)\n\tpub fn build_arguments(\n\t\tsource_filename: \u0026str,\n\t\tstream_index: i32,\n\t\tparams: \u0026ProxyParams,\n\t\toutput_filename: \u0026str,\n\t) -\u003e Vec\u003cString\u003e {\n\t\tlet scale_filter = if params.divider \u003e 1 {\n\t\t\tformat!(\n\t\t\t\t\"scale=w=trunc(iw/{}/2)*2:h=trunc(ih/{}/2)*2\",\n\t\t\t\tparams.divider, params.divider\n\t\t\t)\n\t\t} else {\n\t\t\tformat!(\n\t\t\t\t\"scale=w={}:h={}:force_original_aspect_ratio=decrease\",\n\t\t\t\tparams.width, params.height\n\t\t\t)\n\t\t};\n\n\t\tlet container_format = if params.extension.is_empty() {\n\t\t\t\"mp4\".to_string()\n\t\t} else {\n\t\t\tparams.extension.clone()\n\t\t};\n\n\t\tlet mut args: Vec\u003cString\u003e = vec![\n\t\t\t\"-y\".to_string(),\n\t\t\t\"-nostats\".to_string(),\n\t\t\t\"-progress\".to_string(),\n\t\t\t\"pipe:1\".to_string(),\n\t\t\t\"-i\".to_string(),\n\t\t\tsource_filename.to_string(),\n\t\t\t\"-map\".to_string(),\n\t\t\tformat!(\"0:{stream_index}\"),\n\t\t];\n\n\t\tif params.include_audio {\n\t\t\targs.extend([\n\t\t\t\t\"-map\".to_string(),\n\t\t\t\t\"0:a?\".to_string(),\n\t\t\t\t\"-c:a\".to_string(),\n\t\t\t\t\"aac\".to_string(),\n\t\t\t\t\"-b:a\".to_string(),\n\t\t\t\t\"128k\".to_string(),\n\t\t\t]);\n\t\t} else {\n\t\t\targs.push(\"-an\".to_string());\n\t\t}\n\n\t\targs.extend([\n\t\t\t\"-vf\".to_string(),\n\t\t\tscale_filter,\n\t\t\t\"-c:v\".to_string(),\n\t\t\t\"libx264\".to_string(),\n\t\t\t\"-preset\".to_string(),\n\t\t\tparams.preset.clone(),\n\t\t\t\"-crf\".to_string(),\n\t\t\tparams.crf.to_string(),\n\t\t\t\"-pix_fmt\".to_string(),\n\t\t\t\"yuv420p\".to_string(),\n\t\t\t\"-movflags\".to_string(),\n\t\t\t\"+faststart\".to_string(),\n\t\t\t\"-f\".to_string(),\n\t\t\tcontainer_format,\n\t\t\toutput_filename.to_string(),\n\t\t]);\n\n\t\targs\n\t}\n\n\t/// Parse a single `ffmpeg -progress` output line into a progress value in\n\t/// 0.0..=1.0 given the total duration. Mirrors `parse_progress` in\n\t/// proxy.cpp (golden test).\n\t///\n\t/// CPP-PARITY: src/task/src/proxy/proxy.cpp (parse_progress)\n\tpub fn parse_progress(line: \u0026str, duration_seconds: f64) -\u003e Option\u003cf64\u003e {\n\t\tif duration_seconds \u003c= 0.0 {\n\t\t\treturn None;\n\t\t}\n\n\t\tlet out_time_us: i64 = if let Some(rest) = line.strip_prefix(\"out_time_us=\") {\n\t\t\trest.trim().parse().unwrap_or(-1)\n\t\t} else if let Some(rest) = line.strip_prefix(\"out_time_ms=\") {\n\t\t\t// Despite the name, ffmpeg reports this value in microseconds.\n\t\t\trest.trim().parse().unwrap_or(-1)\n\t\t} else {\n\t\t\t-1\n\t\t};\n\n\t\tif out_time_us \u003c 0 {\n\t\t\treturn None;\n\t\t}\n\n\t\tlet progress = out_time_us as f64 / 1_000_000.0 / duration_seconds;\n\t\tSome(if progress \u003c 0.0 {\n\t\t\t0.0\n\t\t} else if progress \u003e 1.0 {\n\t\t\t1.0\n\t\t} else {\n\t\t\tprogress\n\t\t})\n\t}\n}\n\nimpl TaskBehavior for ProxyTask {\n\t/// Spawn `ffmpeg` with the built arguments, feed `-progress` lines to\n\t/// [`ProxyTask::parse_progress`] and emit them as task progress.\n\tfn run(\u0026mut self, task: \u0026mut Task) -\u003e Result\u003c()\u003e {\n\t\tlet mut ffmpeg_buf = [0i8; 1024];\n\t\tlet found = unsafe {\n\t\t\tbridge::codec::oakcodec_proxy_find_ffmpeg(std::ptr::null(), ffmpeg_buf.as_mut_ptr(), ffmpeg_buf.len() as i32)\n\t\t};\n\t\tif found \u003c= 0 {\n\t\t\ttask.set_error(\n\t\t\t\t\"Failed to generate proxy: ffmpeg executable was not found. Set the ffmpeg path in Preferences \u003e Disk \u003e Proxy Settings.\",\n\t\t\t);\n\t\t\treturn Err(Error::Failed(\"ffmpeg executable was not found\".to_string()));\n\t\t}\n\t\tlet ffmpeg_path = buf_to_string(\u0026ffmpeg_buf);\n\n\t\t// Create the output directory if needed.\n\t\tif let Some(parent) = std::path::Path::new(\u0026self.output_filename).parent() {\n\t\t\tif !parent.as_os_str().is_empty() \u0026\u0026 !parent.exists() {\n\t\t\t\tif std::fs::create_dir_all(parent).is_err() {\n\t\t\t\t\ttask.set_error(\"Failed to create proxy output directory\");\n\t\t\t\t\treturn Err(Error::Failed(\"Failed to create proxy output directory\".to_string()));\n\t\t\t\t}\n\t\t\t}\n\t\t}\n\n\t\tlet _ = std::fs::remove_file(\u0026self.output_filename);\n\t\tlet working_filename = format!(\"{}.working.mp4\", self.output_filename);\n\t\tlet _ = std::fs::remove_file(\u0026working_filename);\n\n\t\tlet args = Self::build_arguments(\u0026self.source_filename, self.stream_index, \u0026self.params, \u0026working_filename);\n\n\t\t// Probe the source duration for progress scaling (0 when unknown).\n\t\tself.duration_seconds = probe_source_duration_seconds(\u0026ffmpeg_path, \u0026self.source_filename);\n\n\t\tlet mut command = Command::new(\u0026ffmpeg_path);\n\t\tcommand.args(\u0026args).stdout(Stdio::piped()).stderr(Stdio::piped());\n\t\tlet mut child = match command.spawn() {\n\t\t\tOk(child) =\u003e child,\n\t\t\tErr(_) =\u003e {\n\t\t\t\ttask.set_error(\"Failed to start ffmpeg for proxy generation\");\n\t\t\t\treturn Err(Error::Failed(\"Failed to start ffmpeg\".to_string()));\n\t\t\t}\n\t\t};\n\n\t\t// Drain stderr in a thread so a chatty ffmpeg cannot block us.\n\t\tlet stderr = child.stderr.take();\n\t\tif let Some(stderr) = stderr {\n\t\t\tstd::thread::spawn(move || {\n\t\t\t\tlet _ = BufReader::new(stderr).lines().count();\n\t\t\t});\n\t\t}\n\n\t\tlet stdout = child.stdout.take();\n\t\tlet mut last_progress = 0.0_f64;\n\t\tif let Some(stdout) = stdout {\n\t\t\tlet reader = BufReader::new(stdout);\n\t\t\tfor line in reader.lines() {\n\t\t\t\tmatch line {\n\t\t\t\t\tOk(line) =\u003e {\n\t\t\t\t\t\tif let Some(progress) = Self::parse_progress(\u0026line, self.duration_seconds) {\n\t\t\t\t\t\t\tif progress \u003e= 0.0 \u0026\u0026 progress - last_progress \u003e 0.001 {\n\t\t\t\t\t\t\t\tlast_progress = progress;\n\t\t\t\t\t\t\t\ttask.emit_progress(progress);\n\t\t\t\t\t\t\t}\n\t\t\t\t\t\t}\n\t\t\t\t\t}\n\t\t\t\t\tErr(_) =\u003e break,\n\t\t\t\t}\n\t\t\t\tif task.is_cancelled() {\n\t\t\t\t\tlet _ = child.kill();\n\t\t\t\t\tlet _ = child.wait();\n\t\t\t\t\tlet _ = std::fs::remove_file(\u0026working_filename);\n\t\t\t\t\ttask.set_error(\"Proxy generation was cancelled\");\n\t\t\t\t\treturn Err(Error::Cancelled);\n\t\t\t\t}\n\t\t\t}\n\t\t}\n\n\t\tlet exit_status = child.wait();\n\t\tif !matches!(exit_status, Ok(status) if status.success()) {\n\t\t\tlet _ = std::fs::remove_file(\u0026working_filename);\n\t\t\ttask.set_error(\"ffmpeg failed to generate proxy\");\n\t\t\treturn Err(Error::Failed(\"ffmpeg failed to generate proxy\".to_string()));\n\t\t}\n\n\t\tif !std::path::Path::new(\u0026working_filename).exists() {\n\t\t\ttask.set_error(\"ffmpeg finished but proxy file was not created\");\n\t\t\treturn Err(Error::Failed(\"ffmpeg finished but proxy file was not created\".to_string()));\n\t\t}\n\n\t\tif std::fs::rename(\u0026working_filename, \u0026self.output_filename).is_err() {\n\t\t\ttask.set_error(\"Failed to move proxy into place\");\n\t\t\treturn Err(Error::Failed(\"Failed to move proxy into place\".to_string()));\n\t\t}\n\n\t\ttask.emit_progress(1.0);\n\t\tOk(())\n\t}\n}\n\n/// Read a NUL-terminated C char buffer into a String.\nfn buf_to_string(buf: \u0026[i8]) -\u003e String {\n\tlet len = buf.iter().position(|\u0026c| c == 0).unwrap_or(buf.len());\n\tunsafe { String::from_utf8_lossy(std::slice::from_raw_parts(buf.as_ptr() as *const u8, len)).into_owned() }\n}\n\n/// Probe the source duration via `ffprobe` next to ffmpeg; 0.0 when\n/// unavailable (in which case no intermediate progress is reported).\nfn probe_source_duration_seconds(ffmpeg_path: \u0026str, source_filename: \u0026str) -\u003e f64 {\n\tlet ffprobe = std::path::Path::new(ffmpeg_path).with_file_name(\"ffprobe\");\n\tif !ffprobe.exists() {\n\t\treturn 0.0;\n\t}\n\tlet output = Command::new(\u0026ffprobe)\n\t\t.args([\"-v\", \"error\", \"-show_entries\", \"format=duration\", \"-of\", \"default=noprint_wrappers=1:nokey=1\", source_filename])\n\t\t.output();\n\tmatch output {\n\t\tOk(out) if out.status.success() =\u003e {\n\t\t\tlet text = String::from_utf8_lossy(\u0026out.stdout);\n\t\t\ttext.trim().parse().unwrap_or(0.0)\n\t\t}\n\t\t_ =\u003e 0.0,\n\t}\n}\n","traces":[{"line":78,"address":[],"length":0,"stats":{"Line":7}},{"line":79,"address":[],"length":0,"stats":{"Line":21}},{"line":80,"address":[],"length":0,"stats":{"Line":21}},{"line":81,"address":[],"length":0,"stats":{"Line":14}},{"line":82,"address":[],"length":0,"stats":{"Line":7}},{"line":83,"address":[],"length":0,"stats":{"Line":0}},{"line":84,"address":[],"length":0,"stats":{"Line":0}},{"line":85,"address":[],"length":0,"stats":{"Line":0}},{"line":87,"address":[],"length":0,"stats":{"Line":14}},{"line":89,"address":[],"length":0,"stats":{"Line":28}},{"line":91,"address":[],"length":0,"stats":{"Line":14}},{"line":103,"address":[],"length":0,"stats":{"Line":6}},{"line":109,"address":[],"length":0,"stats":{"Line":12}},{"line":110,"address":[],"length":0,"stats":{"Line":1}},{"line":115,"address":[],"length":0,"stats":{"Line":5}},{"line":121,"address":[],"length":0,"stats":{"Line":18}},{"line":122,"address":[],"length":0,"stats":{"Line":2}},{"line":124,"address":[],"length":0,"stats":{"Line":10}},{"line":127,"address":[],"length":0,"stats":{"Line":18}},{"line":128,"address":[],"length":0,"stats":{"Line":12}},{"line":129,"address":[],"length":0,"stats":{"Line": e":308,"address":[],"length":0,"stats":{"Line":5}},{"line":309,"address":[],"length":0,"stats":{"Line":408}},{"line":310,"address":[],"length":0,"stats":{"Line":20}},{"line":315,"address":[],"length":0,"stats":{"Line":5}},{"line":316,"address":[],"length":0,"stats":{"Line":15}},{"line":317,"address":[],"length":0,"stats":{"Line":5}},{"line":318,"address":[],"length":0,"stats":{"Line":5}},{"line":320,"address":[],"length":0,"stats":{"Line":0}},{"line":321,"address":[],"length":0,"stats":{"Line":0}},{"line":323,"address":[],"length":0,"stats":{"Line":0}},{"line":324,"address":[],"length":0,"stats":{"Line":0}},{"line":325,"address":[],"length":0,"stats":{"Line":0}},{"line":326,"address":[],"length":0,"stats":{"Line":0}},{"line":328,"address":[],"length":0,"stats":{"Line":0}}],"covered":114,"coverable":141},{"path":["/","Users","sunyu","Projects","oak","src","task","rust","src","render.rs"],"content":"// Oak Video Editor - Non-Linear Video Editor\n// Copyright (C) 2026 Oak Team\n//\n// This program is free software: you can redistribute it and/or modify\n// it under the terms of the GNU General Public License as published by\n// the Free Software Foundation, either version 3 of the License, or\n// (at your option) any later version.\n//\n// This program is distributed in the hope that it will be useful,\n// but WITHOUT ANY WARRANTY; without even the implied warranty of\n// MERCHANTABILITY or FITNESS FOR A PARTICULAR PURPOSE.  See the\n// GNU General Public License for more details.\n//\n// You should have received a copy of the GNU General Public License\n// along with this program.  If not, see \u003chttp://www.gnu.org/licenses/\u003e.\n\n//! `RenderTask` abstract base, mirroring `src/task/src/render/render.h`.\n//!\n//! The abstract parent of [`crate::export::ExportTask`] and\n//! [`crate::precache::PreCacheTask`]. It renders frames/audio through\n//! oakrender tickets (`bridge::render`) and hands each result to a virtual\n//! hook (frame/audio downloaded, subtitle encoded) that the subclass\n//! implements via the [`RenderTaskBehavior`] trait.\n//!\n//! ## Concurrent render loop\n//!\n//! Like the C++ original (`render.cpp`), the loop keeps up to\n//! `max_inflight` tickets running at once (default\n//! `std::thread::available_parallelism()`, matching the C++\n//! `std::max(1, hardware_concurrency)`). Tickets report completion through\n//! the `oakrender_ticket_finished_fn` callback (fired on the ticket's own\n//! finishing thread), which pushes the finished ticket into a shared queue\n//! and wakes the render thread (queue + condvar, exactly the C++ design).\n//! Tickets may complete out of order; a **reorder buffer** delivers the\n//! results to the hooks in timestamp order — the audio range first (the C++\n//! queue-audio-first order), then every frame in ascending time — so the\n//! observable per-frame contract (`frame_downloaded`/`audio_downloaded` in\n//! order, progress updates, cancellation between frames) is unchanged.\n//!\n//! The ticket's finished callback hands the loop a **borrowed copy** of the\n//! submitter's handle (`include/render/ticket.h`: \"the submitter keeps\n//! ownership and releases it\"). The loop therefore releases exactly the\n//! handle value each submit function returns, once, and never releases the\n//! queue's borrowed copies. Cancellation (or a hook error) cancels and\n//! waits every in-flight ticket before returning, so every submitted\n//! ticket's completion still fires exactly once.\n//!\n//! CPP-PARITY: src/task/src/render/render.h\n\nuse std::collections::{HashMap, VecDeque};\nuse std::sync::atomic::{AtomicUsize, Ordering};\nuse std::sync::{Condvar, Mutex};\n\nuse crate::bridge;\nuse crate::bridge::common::OakColorTransform;\nuse crate::bridge::node::{cstr, OAKNODE_SEQUENCE_SAMPLES_INPUT, OAKNODE_SEQUENCE_TEXTURE_INPUT};\nuse crate::bridge::render::{OakRenderTicket, OakRenderVideoTicketParams};\nuse crate::error::{Error, Result};\nuse crate::handle::CHandle;\nuse crate::task::Task;\nuse oakcore_rs::{Rational, TimeRange};\n\n/// `OAKRENDER_TICKET_VIDEO` (`include/render/ticket.h`).\nconst TICKET_VIDEO: i32 = 0;\n/// `OAKRENDER_TICKET_AUDIO` (`include/render/ticket.h`).\nconst TICKET_AUDIO: i32 = 1;\n\n/// Overrides applied to a render ticket, mirroring the C++ `ForceParams`\n/// struct in render.h (fields map onto `oakrender_video_ticket_params`).\n///\n/// CPP-PARITY: src/task/src/render/render.h (ForceParams)\n#[derive(Clone, Debug, Default)]\npub struct ForceParams {\n\t/// Forced output width (0 = off).\n\tpub force_width: i32,\n\t/// Forced output height (0 = off).\n\tpub force_height: i32,\n\t/// Forced color matrix (row-major 4x4); only used when\n\t/// `has_force_matrix` is set.\n\tpub force_matrix: [f64; 16],\n\t/// Whether `force_matrix` is in effect.\n\tpub has_force_matrix: bool,\n\t/// Forced pixel format (`oakcore_rs::PixelFormat` as int; -1 = off).\n\tpub force_format: i32,\n\t/// Forced channel count (0 = off).\n\tpub force_channel_count: i32,\n\t/// Forced color output (borrowed `OakColorProcessor`; empty = none).\n\tpub force_color_output: CHandle,\n}\n\n/// Subclass hooks, standing in for the C++ protected virtuals\n/// `download_frame`/`frame_downloaded`/`audio_downloaded`/`encode_subtitle`.\npub trait RenderTaskBehavior {\n\t/// Called for each rendered frame.\n\tfn frame_downloaded(\u0026mut self, task: \u0026mut Task, frame: CHandle) -\u003e Result\u003c()\u003e;\n\t/// Called for each rendered audio buffer.\n\tfn audio_downloaded(\u0026mut self, task: \u0026mut Task, buffer: CHandle) -\u003e Result\u003c()\u003e;\n\t/// Called to encode a subtitle.\n\tfn encode_subtitle(\u0026mut self, task: \u0026mut Task, text: \u0026str) -\u003e Result\u003c()\u003e;\n}\n\n/// The abstract render task base. Holds the shared [`Task`], the sequence\n/// output params, the viewer node, and the subclass behavior.\npub struct RenderTask {\n\t/// The shared task base.\n\tpub base: Task,\n\t/// Output video params (borrowed `OakVideoParams`).\n\tpub video_params: CHandle,\n\t/// Output audio params (borrowed `OakAudioParams`; may be empty).\n\tpub audio_params: CHandle,\n\t/// The viewer node being rendered (borrowed `OakNodeNode`).\n\tpub viewer: CHandle,\n\t/// Force params applied to every ticket.\n\tpub force_params: ForceParams,\n\t/// The subclass behavior.\n\tpub behavior: Option\u003cBox\u003cdyn RenderTaskBehavior + Send\u003e\u003e,\n\t// --- private render inputs (set by the subclass before render()) ---\n\t/// Borrowed color manager.\n\tcolor_manager: CHandle,\n\t/// Borrowed frame cache.\n\tcache: CHandle,\n\t/// `olive::RenderMode::Mode` as int.\n\tmode: i32,\n\t/// Whether audio ranges are rendered.\n\taudio_enabled: bool,\n\t/// The range rendered by [`RenderTask::render`].\n\texport_range: TimeRange,\n\t/// Whether the render loop emits progress itself (the export task\n\t/// disables it and reports progress per written frame).\n\tnative_progress_signalling: bool,\n\t/// Total number of frames in `export_range` (computed by `render`).\n\ttotal_frames: i64,\n\t/// Maximum render tickets kept in flight at once (the C++\n\t/// `maximum_rendered_frames`; defaults to `available_parallelism`).\n\tmax_inflight: usize,\n}\n\nimpl RenderTask {\n\t/// Create a render task with default (empty) render inputs.\n\tpub fn new(\n\t\tbase: Task,\n\t\tvideo_params: CHandle,\n\t\taudio_params: CHandle,\n\t\tviewer: CHandle,\n\t\tforce_params: ForceParams,\n\t\tbehavior: Option\u003cBox\u003cdyn RenderTaskBehavior + Send\u003e\u003e,\n\t) -\u003e RenderTask {\n\t\tRenderTask {\n\t\t\tbase,\n\t\t\tvideo_params,\n\t\t\taudio_params,\n\t\t\tviewer,\n\t\t\tforce_params,\n\t\t\tbehavior,\n\t\t\tcolor_manager: CHandle::null(),\n\t\t\tcache: CHandle::null(),\n\t\t\tmode: 0,\n\t\t\taudio_enabled: false,\n\t\t\texport_range: TimeRange::new(Rational::new(0, 1), Rational::new(0, 1)),\n\t\t\tnative_progress_signalling: true,\n\t\t\ttotal_frames: 0,\n\t\t\tmax_inflight: std::thread::available_parallelism().map(|n| n.get()).unwrap_or(1).max(1),\n\t\t}\n\t}\n\n\t/// Configure the render inputs before [`RenderTask::render`] (called by\n\t/// the concrete subclasses' `run`).\n\tpub fn set_render_inputs(\n\t\t\u0026mut self,\n\t\tcolor_manager: CHandle,\n\t\tcache: CHandle,\n\t\tmode: i32,\n\t\taudio_enabled: bool,\n\t\texport_range: TimeRange,\n\t) {\n\t\tself.color_manager = color_manager;\n\t\tself.cache = cache;\n\t\tself.mode = mode;\n\t\tself.audio_enabled = audio_enabled;\n\t\tself.export_range = export_range;\n\t}\n\n\t/// Enable/disable the render loop's own progress signalling.\n\tpub fn set_native_progress_signalling(\u0026mut self, enabled: bool) {\n\t\tself.native_progress_signalling = enabled;\n\t}\n\n\t/// Override the number of render tickets kept in flight at once.\n\t///\n\t/// Defaults to `std::thread::available_parallelism()`, mirroring the\n\t/// C++ `std::max(1, int(std::thread::hardware_concurrency()))`. Primarily\n\t/// a test hook: a smaller window makes concurrent-completion tests\n\t/// deterministic regardless of the host core count.\n\tpub fn set_max_inflight(\u0026mut self, max: usize) {\n\t\tself.max_inflight = max.max(1);\n\t}\n\n\t/// The number of frames computed by the last [`RenderTask::render`] run.\n\tpub fn total_frames(\u0026self) -\u003e i64 {\n\t\tself.total_frames\n\t}\n\n\t/// Frame duration rational from the video params (falls back to 1/1\n\t/// when the params are empty/invalid).\n\tfn timebase(\u0026self) -\u003e Rational {\n\t\tlet mut num = 0;\n\t\tlet mut den = 1;\n\t\tunsafe {\n\t\t\tbridge::common::oak_core_videoparams_frame_rate_as_time_base(\n\t\t\t\tself.video_params,\n\t\t\t\t\u0026mut num,\n\t\t\t\t\u0026mut den,\n\t\t\t);\n\t\t}\n\t\tif num \u003c= 0 || den \u003c= 0 {\n\t\t\tRational::new(1, 1)\n\t\t} else {\n\t\t\tRational::new(num as i64, den as i64)\n\t\t}\n\t}\n\n\t/// Submit one video frame ticket at `time` (mirrors the C++\n\t/// `start_video_ticket`). `dispatch` is the shared completion channel\n\t/// handed to the ticket's finished callback.\n\tfn submit_video_ticket(\n\t\t\u0026self,\n\t\ttime: Rational,\n\t\tdispatch: *mut RenderDispatch,\n\t) -\u003e Result\u003cOakRenderTicket\u003e {\n\t\tlet mut output_node = CHandle::null();\n\t\tunsafe {\n\t\t\tbridge::node::oaknode_node_input_get_connected_node(\n\t\t\t\tself.viewer,\n\t\t\t\tcstr(OAKNODE_SEQUENCE_TEXTURE_INPUT),\n\t\t\t\t\u0026mut output_node,\n\t\t\t);\n\t\t}\n\t\tif output_node.ctx.is_null() {\n\t\t\treturn Err(Error::Failed(\"No node connected to the viewer output\".to_string()));\n\t\t}\n\n\t\tlet audio_params_ptr = if self.audio_params.ctx.is_null() {\n\t\t\tstd::ptr::null()\n\t\t} else {\n\t\t\t\u0026self.audio_params as *const CHandle\n\t\t};\n\t\tlet force = \u0026self.force_params;\n\t\tlet params = OakRenderVideoTicketParams {\n\t\t\toutput_node,\n\t\t\tvideo_params: self.video_params,\n\t\t\taudio_params: audio_params_ptr,\n\t\t\ttime_num: time.numerator(),\n\t\t\ttime_den: time.denominator(),\n\t\t\tcolor_manager: self.color_manager,\n\t\t\tmode: self.mode,\n\t\t\tforce_width: force.force_width,\n\t\t\tforce_height: force.force_height,\n\t\t\tforce_matrix: force.force_matrix,\n\t\t\thas_force_matrix: if force.has_force_matrix { 1 } else { 0 },\n\t\t\tforce_format: force.force_format,\n\t\t\tforce_channel_count: force.force_channel_count,\n\t\t\tforce_color_output: bridge::render::OakColorProcessor::from_chandle(force.force_color_output),\n\t\t\tforce_color_transform: OakColorTransform {\n\t\t\t\tctx: std::ptr::null_mut(),\n\t\t\t\taddref: None,\n\t\t\t\trelease: None,\n\t\t\t\tabi_version: 0,\n\t\t\t},\n\t\t\tcache: bridge::render::OakRenderCache::from_chandle(self.cache),\n\t\t};\n\n\t\tlet ticket = unsafe {\n\t\t\tbridge::render::oakrender_ticket_render_frame(\n\t\t\t\t\u0026params,\n\t\t\t\tSome(ticket_finished),\n\t\t\t\tdispatch as *mut std::ffi::c_void,\n\t\t\t)\n\t\t};\n\t\t// Per-frame call: release the borrowed handle box (the ticket keeps\n\t\t// the native node, not the handle).\n\t\tunsafe {\n\t\t\tbridge::node::oaknode_node_free(\u0026mut output_node);\n\t\t}\n\t\tif ticket.ctx.is_null() {\n\t\t\treturn Err(Error::Failed(\"Failed to start frame render ticket\".to_string()));\n\t\t}\n\t\tOk(ticket)\n\t}\n\n\t/// Submit one audio ticket for `range` (the Rust API renders a single\n\t/// range; the C++ submits one ticket per audio range).\n\tfn submit_audio_ticket(\n\t\t\u0026self,\n\t\trange: TimeRange,\n\t\tdispatch: *mut RenderDispatch,\n\t) -\u003e Result\u003cOakRenderTicket\u003e {\n\t\tlet mut output_node = CHandle::null();\n\t\tunsafe {\n\t\t\tbridge::node::oaknode_node_input_get_connected_node(\n\t\t\t\tself.viewer,\n\t\t\t\tcstr(OAKNODE_SEQUENCE_SAMPLES_INPUT),\n\t\t\t\t\u0026mut output_node,\n\t\t\t);\n\t\t}\n\t\tif output_node.ctx.is_null() {\n\t\t\treturn Err(Error::Failed(\"No node connected to the viewer samples input\".to_string()));\n\t\t}\n\n\t\tlet audio_params_ptr = if self.audio_params.ctx.is_null() {\n\t\t\tstd::ptr::null()\n\t\t} else {\n\t\t\t\u0026self.audio_params as *const CHandle\n\t\t};\n\t\tlet ticket = unsafe {\n\t\t\tbridge::render::oakrender_ticket_render_audio(\n\t\t\t\toutput_node,\n\t\t\t\trange.in_().numerator(),\n\t\t\t\trange.in_().denominator(),\n\t\t\t\trange.out().numerator(),\n\t\t\t\trange.out().denominator(),\n\t\t\t\taudio_params_ptr,\n\t\t\t\tself.mode,\n\t\t\t\tSome(ticket_finished),\n\t\t\t\tdispatch as *mut std::ffi::c_void,\n\t\t\t)\n\t\t};\n\t\tunsafe {\n\t\t\tbridge::node::oaknode_node_free(\u0026mut output_node);\n\t\t}\n\t\tif ticket.ctx.is_null() {\n\t\t\treturn Err(Error::Failed(\"Failed to start audio render ticket\".to_string()));\n\t\t}\n\t\tOk(ticket)\n\t}\n\n\t/// Submit a video ticket and account it as in-flight.\n\t///\n\t/// The in-flight count is bumped **before** the submit: a ticket can\n\t/// complete synchronously (its callback fires before the submit returns),\n\t/// so the callback's decrement must always see its increment. A failed\n\t/// submit (null ticket) never fires a callback, so the bump is rolled\n\t/// back.\n\tfn start_video_ticket(\n\t\t\u0026self,\n\t\ttime: Rational,\n\t\tdispatch: *mut RenderDispatch,\n\t\tin_flight: \u0026mut Vec\u003cOakRenderTicket\u003e,\n\t) -\u003e Result\u003c()\u003e {\n\t\tunsafe {\n\t\t\t(\u0026*dispatch).running.fetch_add(1, Ordering::SeqCst);\n\t\t}\n\t\tmatch self.submit_video_ticket(time, dispatch) {\n\t\t\tOk(ticket) =\u003e {\n\t\t\t\tin_flight.push(ticket);\n\t\t\t\tOk(())\n\t\t\t}\n\t\t\tErr(e) =\u003e {\n\t\t\t\tunsafe {\n\t\t\t\t\t(\u0026*dispatch).running.fetch_sub(1, Ordering::SeqCst);\n\t\t\t\t}\n\t\t\t\tErr(e)\n\t\t\t}\n\t\t}\n\t}\n\n\t/// Submit the audio ticket and account it as in-flight (see\n\t/// [`RenderTask::start_video_ticket`] for the counting contract).\n\tfn start_audio_ticket(\n\t\t\u0026self,\n\t\trange: TimeRange,\n\t\tdispatch: *mut RenderDispatch,\n\t\tin_flight: \u0026mut Vec\u003cOakRenderTicket\u003e,\n\t) -\u003e Result\u003c()\u003e {\n\t\tunsafe {\n\t\t\t(\u0026*dispatch).running.fetch_add(1, Ordering::SeqCst);\n\t\t}\n\t\tmatch self.submit_audio_ticket(range, dispatch) {\n\t\t\tOk(ticket) =\u003e {\n\t\t\t\tin_flight.push(ticket);\n\t\t\t\tOk(())\n\t\t\t}\n\t\t\tErr(e) =\u003e {\n\t\t\t\tunsafe {\n\t\t\t\t\t(\u0026*dispatch).running.fetch_sub(1, Ordering::SeqCst);\n\t\t\t\t}\n\t\t\t\tErr(e)\n\t\t\t}\n\t\t}\n\t}\n\n\t/// Map a finished ticket back to its delivery slot: the audio slot for\n\t/// audio tickets, the matching frame slot for video tickets.\n\tfn classify_ticket(\n\t\t\u0026self,\n\t\tticket: \u0026OakRenderTicket,\n\t\tslot_by_key: \u0026HashMap\u003c(i32, i64, i64), usize\u003e,\n\t) -\u003e Option\u003cusize\u003e {\n\t\tlet kind = unsafe { bridge::render::oakrender_ticket_get_type(*ticket) };\n\t\tif kind == TICKET_AUDIO {\n\t\t\tlet mut a = 0i64;\n\t\t\tlet mut b = 1i64;\n\t\t\tlet mut c = 0i64;\n\t\t\tlet mut d = 1i64;\n\t\t\tunsafe {\n\t\t\t\tbridge::render::oakrender_ticket_get_range(*ticket, \u0026mut a, \u0026mut b, \u0026mut c, \u0026mut d);\n\t\t\t}\n\t\t\tslot_by_key.get(\u0026(TICKET_AUDIO, a, b)).copied()\n\t\t} else if kind == TICKET_VIDEO {\n\t\t\tlet mut n = 0i64;\n\t\t\tlet mut d = 1i64;\n\t\t\tunsafe {\n\t\t\t\tbridge::render::oakrender_ticket_get_time(*ticket, \u0026mut n, \u0026mut d);\n\t\t\t}\n\t\t\tslot_by_key.get(\u0026(TICKET_VIDEO, n, d)).copied()\n\t\t} else {\n\t\t\tNone\n\t\t}\n\t}\n\n\t/// Drive the whole render: keep up to `max_inflight` frame tickets in\n\t/// flight (audio first, then frames in timestamp order), deliver each\n\t/// finished ticket's result to the behavior hooks in timestamp order via\n\t/// the reorder buffer, and stop on cancellation or a hook error —\n\t/// cancelling and waiting every still-running ticket so their\n\t/// completions fire exactly once.\n\t///\n\t/// `task` is the live driving task (cancellation/progress/error\n\t/// reporting); `behavior` is the concrete subclass receiving the\n\t/// `frame_downloaded`/`audio_downloaded` hooks.\n\tpub fn render(\u0026mut self, task: \u0026mut Task, behavior: \u0026mut dyn RenderTaskBehavior) -\u003e Result\u003c()\u003e {\n\t\tlet timebase = self.timebase();\n\n\t\t// Compute the frame timestamps (progress denominator mirrors the\n\t\t// C++ `total_length \u003c= 0 -\u003e 1` guard).\n\t\tlet mut frame_times: Vec\u003cRational\u003e = Vec::new();\n\t\tlet mut t = self.export_range.in_();\n\t\twhile t \u003c self.export_range.out() {\n\t\t\tframe_times.push(t);\n\t\t\tt = t + timebase;\n\t\t}\n\t\tself.total_frames = frame_times.len() as i64;\n\t\tlet total_length = if frame_times.is_empty() { 1.0 } else { frame_times.len() as f64 };\n\n\t\t// Delivery order: the audio range first (mirrors the C++ queue\n\t\t// order), then every frame in ascending timestamp order. The reorder\n\t\t// buffer delivers to the hooks in exactly this order no matter the\n\t\t// completion order.\n\t\tlet mut slots: Vec\u003cDeliverySlot\u003e = Vec::new();\n\t\tif self.audio_enabled {\n\t\t\tslots.push(DeliverySlot {\n\t\t\t\tkind: TICKET_AUDIO,\n\t\t\t\ttime: self.export_range.in_(),\n\t\t\t});\n\t\t}\n\t\tfor \u0026ft in \u0026frame_times {\n\t\t\tslots.push(DeliverySlot {\n\t\t\t\tkind: TICKET_VIDEO,\n\t\t\t\ttime: ft,\n\t\t\t});\n\t\t}\n\t\tlet mut slot_by_key: HashMap\u003c(i32, i64, i64), usize\u003e = HashMap::with_capacity(slots.len());\n\t\tfor (i, slot) in slots.iter().enumerate() {\n\t\t\tslot_by_key.insert((slot.kind, slot.time.numerator(), slot.time.denominator()), i);\n\t\t}\n\t\tlet total_slots = slots.len();\n\n\t\t// The shared completion channel. Heap-allocated: the C callback\n\t\t// reaches it through its `userdata` pointer. Freed only once every\n\t\t// in-flight ticket has fired its callback (`running == 0`).\n\t\tlet dispatch = Box::into_raw(Box::new(RenderDispatch::new()));\n\t\t// Shared view of the same state for the render thread (the raw\n\t\t// pointer stays valid until the box is freed below).\n\t\tlet dispatch_ref = unsafe { \u0026*dispatch };\n\t\tlet window = self.max_inflight.max(1);\n\n\t\t// Tickets we hold (the submitter's copy of each handle, released\n\t\t// exactly once at the end); `consumed` counts tickets whose finished\n\t\t// queue copy has been popped, so `in_flight.len() - consumed` is the\n\t\t// live window.\n\t\tlet mut in_flight: Vec\u003cOakRenderTicket\u003e = Vec::new();\n\t\tlet mut consumed = 0usize;\n\t\t// Next frame timestamp to submit and next delivery slot.\n\t\tlet mut next_frame_index = 0usize;\n\t\tlet mut next_slot = 0usize;\n\t\t// Reorder buffer: finished tickets not yet deliverable.\n\t\tlet mut pending: HashMap\u003cusize, OakRenderTicket\u003e = HashMap::new();\n\t\tlet mut progress_counter = 0.0;\n\t\tlet mut result: Result\u003c()\u003e = Ok(());\n\n\t\t// Queue audio first (mirrors the C++ order).\n\t\tif self.audio_enabled \u0026\u0026 result.is_ok() {\n\t\t\tif let Err(e) = self.start_audio_ticket(self.export_range, dispatch, \u0026mut in_flight) {\n\t\t\t\tresult = Err(e);\n\t\t\t}\n\t\t}\n\n\t\t// Start the initial frame window. unyu","Projects","oak","src","task","rust","src","task.rs"],"content":"// Oak Video Editor - Non-Linear Video Editor\n// Copyright (C) 2026 Oak Team\n//\n// This program is free software: you can redistribute it and/or modify\n// it under the terms of the GNU General Public License as published by\n// the Free Software Foundation, either version 3 of the License, or\n// (at your option) any later version.\n//\n// This program is distributed in the hope that it will be useful,\n// but WITHOUT ANY WARRANTY; without even the implied warranty of\n// MERCHANTABILITY or FITNESS FOR A PARTICULAR PURPOSE.  See the\n// GNU General Public License for more details.\n//\n// You should have received a copy of the GNU General Public License\n// along with this program.  If not, see \u003chttp://www.gnu.org/licenses/\u003e.\n\n//! The `Task` base class, mirroring `src/task/src/task.h` (`olive::Task`).\n//!\n//! The C++ class is abstract with a protected virtual `run()`. In Rust each\n//! concrete task (`ConformTask`, `ProxyTask`, …) is its own struct and the\n//! shared lifecycle lives here; the per-task work is supplied through\n//! [`TaskBehavior`] (a trait object, per architectural decision #1 in\n//! README.md). Cancellation rides on a borrowed oakrender `OakCancelAtom`\n//! reached through `crate::bridge::render`.\n//!\n//! CPP-PARITY: src/task/src/task.h\n//!\n//! ## Concurrency contract\n//!\n//! Like the C++ original, the task's `title`/`error` strings are mutated on\n//! the task's own thread (`run()`). The C ABI layer must therefore only read\n//! them while the task is not concurrently running — i.e. before\n//! [`Task::start`] or after the task finished (the `finished` flag is\n//! synchronized through the `done` condvar, so `is_finished()`/\n//! `succeeded()` are always race-free). This mirrors the C++ semantics\n//! exactly.\n\nuse std::sync::atomic::{AtomicI64, Ordering};\nuse std::sync::{Arc, Condvar, Mutex};\n\nuse crate::bridge;\nuse crate::error::{Error, Result};\nuse crate::handle::CHandle;\n\n/// Event type emitted through a task's [`EventListener`], mirroring the\n/// C++ `EventType` enum (`k_event_started`/`k_event_progress`/`k_event_finished`).\n///\n/// CPP-PARITY: src/task/src/task.h (EventType)\n#[derive(Clone, Copy, Debug, PartialEq)]\npub enum TaskEvent {\n\t/// Task began executing.\n\tStarted,\n\t/// Progress updated; the payload is in 0.0..=1.0.\n\tProgress(f64),\n\t/// Task finished (success or failure).\n\tFinished,\n}\n\n/// A listener notified of [`TaskEvent`]s, mirroring the C++\n/// `std::function\u003cvoid(EventType,double)\u003e` listener. Delivered under the\n/// task's lock; kept as the single async return channel (decision #3).\n///\n/// CPP-PARITY: src/task/src/task.h (EventListener)\npub type EventListener = Box\u003cdyn FnMut(TaskEvent) + Send\u003e;\n\n/// Trait supplying the per-task work, standing in for the C++ protected\n/// virtual `run()`. Concrete tasks implement this; [`Task::start`] drives it.\n///\n/// CPP-PARITY: src/task/src/task.h (run)\npub trait TaskBehavior {\n\t/// Perform the task's work. Returning `Err(Error::Cancelled)` is treated\n\t/// as a cancellation; any other `Err` marks the task failed.\n\tfn run(\u0026mut self, task: \u0026mut Task) -\u003e Result\u003c()\u003e;\n}\n\n/// Values the subscribe wrapper needs to re-encode [`TaskEvent`]s into the\n/// C ABI callback signature `(event_id, value, userdata)`. The C++ emits\n/// the start timestamp with `k_event_started` and 1.0/0.0 with\n/// `k_event_finished`; `TaskEvent` carries neither, so the task publishes\n/// them into this shared state before emitting (decision #1 in README.md).\n#[derive(Debug, Default)]\npub struct SubscriberState {\n\t/// Start timestamp (ms since epoch) published before `Started` is emitted.\n\tpub start_ms: AtomicI64,\n\t/// 1.0/0.0 published before `Finished` is emitted.\n\tpub finished_value: AtomicI64,\n}\n\n/// Finish state, protected by the `done` condvar pair so `is_finished`/\n/// `succeeded` are readable from any thread while the task thread mutates\n/// them.\n#[derive(Default)]\nstruct TaskDone {\n\t/// Whether the task has finished (success or failure).\n\tfinished: bool,\n\t/// Whether the task finished successfully.\n\tsucceeded: bool,\n}\n\n/// The base task. Owns lifecycle state plus a borrowed oakrender cancel\n/// atom; the concrete behavior lives in a [`TaskBehavior`] trait object.\npub struct Task {\n\ttitle: String,\n\terror: Option\u003cString\u003e,\n\tstart_time: Option\u003cstd::time::Instant\u003e,\n\tcancel_atom: CHandle,\n\towns_atom: bool,\n\tevent_listener: Option\u003cEventListener\u003e,\n\tcancel_event: Option\u003cBox\u003cdyn FnMut() + Send\u003e\u003e,\n\tstarted: bool,\n\tfinished: bool,\n\tsucceeded: bool,\n\tbehavior: Option\u003cBox\u003cdyn TaskBehavior + Send\u003e\u003e,\n\t/// Finish/success flag pair + wakeup condvar (race-free readers).\n\tdone: Arc\u003c(Mutex\u003cTaskDone\u003e, Condvar)\u003e,\n\t/// Values published for the C ABI subscribe wrapper.\n\tsubscriber: Option\u003cArc\u003cSubscriberState\u003e\u003e,\n}\n\nimpl Drop for Task {\n\tfn drop(\u0026mut self) {\n\t\t// Free the cancellation atom only when we created it ourselves;\n\t\t// borrowed atoms are released by their owner.\n\t\tif self.owns_atom \u0026\u0026 !self.cancel_atom.is_null() {\n\t\t\tlet mut atom = bridge::render::OakCancelAtom::from_chandle(self.cancel_atom);\n\t\t\tunsafe {\n\t\t\t\tbridge::render::oakrender_cancelatom_free(\u0026mut atom);\n\t\t\t}\n\t\t}\n\t}\n}\n\nimpl Task {\n\t/// Create a new task with the given title and a borrowed oakrender\n\t/// cancel atom. When `cancel_atom` is empty a fresh atom is created and\n\t/// owned by the task (mirroring the C++ constructor).\n\tpub fn new(title: \u0026str, cancel_atom: CHandle) -\u003e Task {\n\t\tlet (cancel_atom, owns_atom) = if cancel_atom.is_null() {\n\t\t\tlet atom = unsafe { bridge::render::oakrender_cancelatom_init() };\n\t\t\t(atom.to_chandle(), true)\n\t\t} else {\n\t\t\t(cancel_atom, false)\n\t\t};\n\t\tTask {\n\t\t\ttitle: title.to_string(),\n\t\t\terror: None,\n\t\t\tstart_time: None,\n\t\t\tcancel_atom,\n\t\t\towns_atom,\n\t\t\tevent_listener: None,\n\t\t\tcancel_event: None,\n\t\t\tstarted: false,\n\t\t\tfinished: false,\n\t\t\tsucceeded: false,\n\t\t\tbehavior: None,\n\t\t\tdone: Arc::new((Mutex::new(TaskDone::default()), Condvar::new())),\n\t\t\tsubscriber: None,\n\t\t}\n\t}\n\n\t/// Attach the concrete behavior (defaults to a no-op).\n\tpub fn set_behavior(\u0026mut self, behavior: Box\u003cdyn TaskBehavior + Send\u003e) {\n\t\tself.behavior = Some(behavior);\n\t}\n\n\t/// Start the task: set `started`, emit [`TaskEvent::Started`], run the\n\t/// behavior, then mark finished and emit [`TaskEvent::Finished`].\n\t///\n\t/// The returned `Result` mirrors the C++ `start()` bool: `Ok(())` when\n\t/// the behavior succeeded, `Err(..)` otherwise.\n\tpub fn start(\u0026mut self) -\u003e Result\u003c()\u003e {\n\t\tlet start_ms = system_time_ms();\n\t\tself.start_time = Some(std::time::Instant::now());\n\t\tself.started = true;\n\t\tif let Some(s) = \u0026self.subscriber {\n\t\t\ts.start_ms.store(start_ms, Ordering::SeqCst);\n\t\t}\n\t\tself.emit_event(TaskEvent::Started);\n\n\t\t// Take the behavior out so it can receive `self` (avoids a\n\t\t// self-referential borrow); put it back afterwards.\n\t\tlet behavior = self.behavior.take();\n\t\tlet ret = if let Some(mut b) = behavior {\n\t\t\tlet r = b.run(self);\n\t\t\tself.behavior = Some(b);\n\t\t\tr\n\t\t} else {\n\t\t\tOk(())\n\t\t};\n\n\t\tlet succeeded = ret.is_ok();\n\t\t{\n\t\t\tlet mut done = self.done.0.lock().unwrap();\n\t\t\tdone.finished = true;\n\t\t\tdone.succeeded = succeeded;\n\t\t\tself.done.1.notify_all();\n\t\t}\n\t\tif let Some(s) = \u0026self.subscriber {\n\t\t\ts.finished_value.store(if succeeded { 1 } else { 0 }, Ordering::SeqCst);\n\t\t}\n\t\tself.emit_event(TaskEvent::Finished);\n\n\t\t// One-shot subscription: drop the listener after the final event.\n\t\tself.event_listener = None;\n\n\t\tret\n\t}\n\n\t/// Request cancellation through the borrowed oakrender cancel atom, then\n\t/// invoke the cancel event callback if one is registered.\n\tpub fn cancel(\u0026mut self) {\n\t\tif !self.cancel_atom.is_null() {\n\t\t\tlet atom = bridge::render::OakCancelAtom::from_chandle(self.cancel_atom);\n\t\t\tunsafe {\n\t\t\t\tbridge::render::oakrender_cancelatom_cancel(atom);\n\t\t\t}\n\t\t}\n\t\tif let Some(cb) = self.cancel_event.as_mut() {\n\t\t\tcb();\n\t\t}\n\t}\n\n\t/// Whether cancellation was requested (queries the oakrender atom).\n\tpub fn is_cancelled(\u0026self) -\u003e bool {\n\t\tif self.cancel_atom.is_null() {\n\t\t\treturn false;\n\t\t}\n\t\tlet atom = bridge::render::OakCancelAtom::from_chandle(self.cancel_atom);\n\t\tlet mut cancelled = 0;\n\t\tunsafe {\n\t\t\tbridge::render::oakrender_cancelatom_is_cancelled(atom, \u0026mut cancelled);\n\t\t}\n\t\tcancelled != 0\n\t}\n\n\t/// The borrowed cancel atom handle (empty for tasks without one).\n\tpub fn get_cancel_atom(\u0026self) -\u003e CHandle {\n\t\tself.cancel_atom\n\t}\n\n\t/// Replace the cancel atom. A previously owned atom is freed; the new\n\t/// atom is borrowed (never freed by this task). Used to share one atom\n\t/// between a task and its behavior's inner base task.\n\tpub fn set_cancel_atom(\u0026mut self, atom: CHandle) {\n\t\tif self.owns_atom \u0026\u0026 !self.cancel_atom.is_null() {\n\t\t\tlet mut old = bridge::render::OakCancelAtom::from_chandle(self.cancel_atom);\n\t\t\tunsafe {\n\t\t\t\tbridge::render::oakrender_cancelatom_free(\u0026mut old);\n\t\t\t}\n\t\t}\n\t\tself.cancel_atom = atom;\n\t\tself.owns_atom = false;\n\t}\n\n\t/// Register the event listener. Replaces any previous listener.\n\tpub fn set_event_listener(\u0026mut self, listener: EventListener) {\n\t\tself.event_listener = Some(listener);\n\t}\n\n\t/// Register a hook invoked when [`Task::cancel`] is called.\n\tpub fn set_cancel_event(\u0026mut self, cb: Box\u003cdyn FnMut() + Send\u003e) {\n\t\tself.cancel_event = Some(cb);\n\t}\n\n\t/// Publish the shared values used by the C ABI subscribe wrapper.\n\tpub fn set_subscriber(\u0026mut self, state: Arc\u003cSubscriberState\u003e) {\n\t\tself.subscriber = Some(state);\n\t}\n\n\t/// Emit a progress update, clamping to 0.0..=1.0 and delivering it to the\n\t/// listener as [`TaskEvent::Progress`].\n\tpub fn emit_progress(\u0026mut self, progress: f64) {\n\t\tself.emit_event(TaskEvent::Progress(progress.clamp(0.0, 1.0)));\n\t}\n\n\t/// Reset lifecycle state so the task can be run again.\n\tpub fn reset(\u0026mut self) {\n\t\tself.started = false;\n\t\tself.finished = false;\n\t\tself.succeeded = false;\n\t\tself.error = None;\n\t\tself.start_time = None;\n\t\t{\n\t\t\tlet mut done = self.done.0.lock().unwrap();\n\t\t\tdone.finished = false;\n\t\t\tdone.succeeded = false;\n\t\t}\n\t}\n\n\t/// Record a failure message and mark the task failed.\n\tpub fn set_error(\u0026mut self, message: \u0026str) {\n\t\tself.error = Some(message.to_string());\n\t}\n\n\t/// Change the task title.\n\tpub fn set_title(\u0026mut self, title: \u0026str) {\n\t\tself.title = title.to_string();\n\t}\n\n\t/// The task title.\n\tpub fn title(\u0026self) -\u003e \u0026str {\n\t\t\u0026self.title\n\t}\n\n\t/// The failure message, if the task failed.\n\tpub fn error(\u0026self) -\u003e Option\u003c\u0026str\u003e {\n\t\tself.error.as_deref()\n\t}\n\n\t/// Whether the task has finished (success or failure).\n\tpub fn is_finished(\u0026self) -\u003e bool {\n\t\tself.done.0.lock().unwrap().finished\n\t}\n\n\t/// Whether the task finished successfully.\n\tpub fn succeeded(\u0026self) -\u003e bool {\n\t\tself.done.0.lock().unwrap().succeeded\n\t}\n\n\t/// Block until the task finishes. Mirrors the C++ finished-wait condvar;\n\t/// the manager joins worker threads instead, but this is useful for\n\t/// direct (non-manager) runs. Returns immediately when the task has not\n\t/// been started yet (nothing to wait for) or is already  = CHandle;\n/// `OakNodeFootage` (`include/node/footage.h`).\npub type OakNodeFootage = CHandle;\n/// `OakNodeSequence` (`include/node/sequence.h`).\npub type OakNodeSequence = CHandle;\n/// `OakNodeTrack` (`include/node/track.h`).\npub type OakNodeTrack = CHandle;\n/// `OakNodeTrackList` (`include/node/track.h`).\npub type OakNodeTrackList = CHandle;\n/// `OakNodeBlock` (`include/node/block.h`).\npub type OakNodeBlock = CHandle;\n/// `OakNodeColorManager` (`include/node/colormanager.h`).\npub type OakNodeColorManager = CHandle;\n/// `OakNodeSerializerSaveData` (`include/node/serializer.h`).\npub type OakNodeSerializerSaveData = CHandle;\n/// `OakNodeSerializerLoadData` (`include/node/serializer.h`).\npub type OakNodeSerializerLoadData = CHandle;\n\n/// `OAKNODE_SEQUENCE_TEXTURE_INPUT` (`include/node/sequence.h`).\npub const OAKNODE_SEQUENCE_TEXTURE_INPUT: \u0026str = \"tex_in\";\n/// `OAKNODE_SEQUENCE_SAMPLES_INPUT` (`include/node/sequence.h`).\npub const OAKNODE_SEQUENCE_SAMPLES_INPUT: \u0026str = \"samples_in\";\n/// `OAKNODE_TRACK_TYPE_VIDEO` (`include/node/track.h`).\npub const OAKNODE_TRACK_TYPE_VIDEO: c_int = 0;\n/// `OAKNODE_TRACK_TYPE_AUDIO` (`include/node/track.h`).\npub const OAKNODE_TRACK_TYPE_AUDIO: c_int = 1;\n/// `OAKNODE_TRACK_TYPE_NONE` (`include/node/track.h`).\npub const OAKNODE_TRACK_TYPE_NONE: c_int = -1;\n/// `OAKNODE_BLOCK_OTHER` (`include/node/block.h`).\npub const OAKNODE_BLOCK_OTHER: c_int = 0;\n/// `OAKNODE_BLOCK_CLIP` (`include/node/block.h`).\npub const OAKNODE_BLOCK_CLIP: c_int = 1;\n/// `OAKNODE_BLOCK_GAP` (`include/node/block.h`).\npub const OAKNODE_BLOCK_GAP: c_int = 2;\n/// `OAKNODE_BLOCK_TRANSITION` (`include/node/block.h`).\npub const OAKNODE_BLOCK_TRANSITION: c_int = 3;\n/// `OAKNODE_TRANSITION_CROSS_DISSOLVE` (`include/node/block.h`).\npub const OAKNODE_TRANSITION_CROSS_DISSOLVE: c_int = 0;\n/// `OAKNODE_TRANSITION_OUT_BLOCK_INPUT` (`include/node/block.h`).\npub const OAKNODE_TRANSITION_OUT_BLOCK_INPUT: \u0026str = \"out_block_ rence-counted object.\n\tpub ctx: *mut c_void,\n\t/// Atomic increment.\n\tpub addref: Option\u003cunsafe extern \"C\" fn(*mut c_void)\u003e,\n\t/// Atomic decrement; destroys at zero.\n\tpub release: Option\u003cunsafe extern \"C\" fn(*mut c_void)\u003e,\n\t/// ABI version (`OAKRENDER_ABI_VERSION`).\n\tpub abi_version: u32,\n}\n\nimpl OakCancelAtom {\n\t/// The empty (null) atom.\n\tpub fn null() -\u003e Self {\n\t\tOakCancelAtom {\n\t\t\tctx: std::ptr::null_mut(),\n\t\t\taddref: None,\n\t\t\trelease: None,\n\t\t\tabi_version: 0,\n\t\t}\n\t}\n\n\t/// Whether the atom is empty (`ctx == NULL`).\n\tpub fn is_null(\u0026self) -\u003e bool {\n\t\tself.ctx.is_null()\n\t}\n\n\t/// Adopt the fields of a generic `CHandle` (layout-identical) — the task\n\t/// module stores the atom as a `CHandle` for its public API.\n\tpub fn from_chandle(h: CHandle) -\u003e Self {\n\t\tOakCancelAtom {\n\t\t\tctx: h.ctx,\n\t\t\taddref: h.addref,\n\t\t\trelease: h.release,\n\t\t\tabi_version: h.abi_version,\n\t\t}\n\t}\n\n\t/// Convert back to a generic `CHandle` (layout-identical).\n\tpub fn to_chandle(\u0026self) -\u003e CHandle {\n\t\tCHandle {\n\t\t\tctx: self.ctx,\n\t\t\taddref: self.addref,\n\t\t\trelease: self.release,\n\t\t\tabi_version: self.abi_version,\n\t\t}\n\t}\n}\n\n/// Mirror of `OakRenderTicket` (`include/render/ticket.h`).\n#[repr(C)]\n#[derive(Clone, Copy)]\npub struct OakRenderTicket {\n\t/// Opaque pointer to the reference-counted object.\n\tpub ctx: *mut c_void,\n\t/// Atomic increment.\n\tpub addref: Option\u003cunsafe extern \"C\" fn(*mut c_void)\u003e,\n\t/// Atomic decrement; destroys at zero.\n\tpub release: Option\u003cunsafe extern \"C\" fn(*mut c_void)\u003e,\n\t/// ABI version (`OAKRENDER_ABI_VERSION`).\n\tpub abi_version: u32,\n}\n\n/// Mirror of `OakRenderCache` (`include/render/cache.h`).\n#[repr(C)]\n#[derive(Clone, Copy)]\npub struct OakRenderCache {\n\t/// Opaque pointer to the reference-counted object.\n\tpub ctx: *mut c_void,\n\t/// Atomic increment.\n\t
