.\n///\n/// # Safety\n/// `req` must be a valid `OakCodecTaskRequest` or null.\nunsafe extern \"C\" fn submit_codec_task(req: *const bridge::codec::OakCodecTaskRequest, _userdata: *mut c_void) -\u003e c_int {\n\tif req.is_null() {\n\t\treturn bridge::codec::OAKCODEC_E_INVALID;\n\t}\n\tlet request = unsafe { \u0026*req };\n\n\t// Build the concrete task on an outer base so the behavior can be\n\t// driven by `start()`; both share the cancellation atom.\n\tmatch request.kind {\n\t\tbridge::codec::OAKCODEC_TASK_CONFORM =\u003e {\n\t\t\tlet task = ConformTask::new(request);\n\t\t\tlet atom = task.base.get_cancel_atom();\n\t\t\tlet title = task.base.title().to_string();\n\t\t\tlet mut outer = Task::new(\u0026title, atom);\n\t\t\touter.set_behavior(Box::new(task));\n\t\t\tmatch outer.start() {\n\t\t\t\tOk(()) =\u003e 0,\n\t\t\t\tErr(_) =\u003e bridge::codec::OAKCODEC_E_FAILED,\n\t\t\t}\n\t\t}\n\t\tbridge::codec::OAKCODEC_TASK_PROXY =\u003e {\n\t\t\tlet mut codec_params = bridge::codec::OakCodecProxyParams {\n\t\t\t\twidth: 0,\n\t\t\t\theight: 0,\n\t\t\t\tdivider: 0,\n\t\t\t\tversion: 0,\n\t\t\t\tcrf: 0,\n\t\t\t\tinclude_audio: 0,\n\t\t\t\textension: [0; 32],\n\t\t\t\tpreset: [0; 32],\n\t\t\t};\n\t\t\tunsafe {\n\t\t\t\tbridge::codec::oakcodec_proxy_params_default(\u0026mut codec_params);\n\t\t\t}\n\t\t\tlet params = proxy_params_from_codec(\u0026codec_params);\n\t\t\tlet task = ProxyTask::new(request, params);\n\t\t\tlet atom = task.base.get_cancel_atom();\n\t\t\tlet title = task.base.title().to_string();\n\t\t\tlet mut outer = Task::new(\u0026title, atom);\n\t\t\touter.set_behavior(Box::new(task));\n\t\t\tmatch outer.start() {\n\t\t\t\tOk(()) =\u003e 0,\n\t\t\t\tErr(_) =\u003e bridge::codec::OAKCODEC_E_FAILED,\n\t\t\t}\n\t\t}\n\t\t_ =\u003e bridge::codec::OAKCODEC_E_INVALID,\n\t}\n}\n\n/// Install the task-module submitter as oakcodec's callback. Returns\n/// `Err(Error::State)` if already registered.\npub fn register_codec_task_submitter() -\u003e Result\u003c()\u003e {\n\tif is_codec_task_submitter_registered() {\n\t\treturn Err(Error::State);\n\t}\n\tunsafe {\n\t\tbridge::codec::oakcodec_set_task_submit_cb(Some(submit_codec_task), std::ptr::null_mut());\n\t}\n\tOk(())\n}\n\n/// Remove the task-module submitter from oakcodec. Idempotent.\npub fn unregister_codec_task_submitter() -\u003e Result\u003c()\u003e {\n\tunsafe {\n\t\tbridge::codec::oakcodec_set_task_submit_cb(None, std::ptr::null_mut());\n\t}\n\tOk(())\n}\n\n/// Whether a submitter is currently installed (queries oakcodec).\npub fn is_codec_task_submitter_registered() -\u003e bool {\n\tunsafe { bridge::codec::oakcodec_task_submit_is_registered() != 0 }\n}\n","traces":[{"line":36,"address":[],"length":0,"stats":{"Line":7}},{"line":38,"address":[],"length":0,"stats":{"Line":14}},{"line":39,"address":[],"length":0,"stats":{"Line":14}},{"line":40,"address":[],"length":0,"stats":{"Line":14}},{"line":41,"address":[],"length":0,"stats":{"Line":14}},{"line":42,"address":[],"length":0,"stats":{"Line":14}},{"line":43,"address":[],"length":0,"stats":{"Line":14}},{"line":44,"address":[],"length":0,"stats":{"Line":21}},{"line":45,"address":[],"length":0,"stats":{"Line":7}},{"line":50,"address":[],"length":0,"stats":{"Line":14}},{"line":51,"address":[],"length":0,"stats":{"Line":175}},{"line":52,"address":[],"length":0,"stats":{"Line":56}},{"line":53,"address":[],"length":0,"stats":{"Line":42}},{"line":61,"address":[],"length":0,"stats":{"Line":16}},{"line":62,"address":[],"length":0,"stats":{"Line":32}},{"line":63,"address":[],"length":0,"stats":{"Line":1}},{"line":65,"address":[],"length":0,"stats":{"Line":30}},{"line":69,"address":[],"length":0,"stats":{"Line":15}},{"line":71,"address":[],"length":0,"stats":{"Line":21}},{"line":72,"address":[],"length":0,"stats":{"Line":21}},{"line":73,"address":[],"length":0,"stats":{"Line":21}},{"line":74,"address":[],"length":0,"stats":{"Line":28}},{"line":75,"address":[],"length":0,"stats":{"Line":21}},{"line":76,"address":[],"length":0,"stats":  implied warranty of\n// MERCHANTABILITY or FITNESS FOR A PARTICULAR PURPOSE.  See the\n// GNU General Public License for more details.\n//\n// You should have received a copy of the GNU General Public License\n// along with this program.  If not, see \u003chttp://www.gnu.org/licenses/\u003e.\n\n//! `ConformTask`, mirroring `src/task/src/conform/conform.h`.\n//!\n//! Transcodes an audio stream to a PCM cache file (oakcodec kind\n//! `OAKCODEC_TASK_CONFORM`) and reports progress as it decodes.\n//!\n//! CPP-PARITY: src/task/src/conform/conform.h\n\nuse crate::bridge;\nuse crate::error::{Error, Result};\nuse crate::ffi::taskhandle::cstr;\nuse crate::handle::CHandle;\nuse crate::task::{Task, TaskBehavior};\n\n/// A conform task: copies/channels of one audio stream into per-channel\n/// working PCM cache files, then renames them to the final names.\npub struct ConformTask {\n\t/// The shared task base.\n\tpub base: Task,\n\t/// Absolute input media filename.\n\tpub input_filename: String,\n\t/// Final destination path (replaces the source path extension).\n\tpub output_filename: String,\n\t/// Audio stream index inside the source media.\n\tpub stream_index: i32,\n\t/// Target sample rate (Hz).\n\tpub sample_rate: i32,\n\t/// Target channel layout mask (ffmpeg-style).\n\tpub channel_layout: u64,\n\t/// Target sample format (enum as int; `oakcore_rs::SampleFormat`).\n\tpub sample_format: i32,\n\t/// Resolved final per-channel filenames (from [`ConformTask::derive_filenames`]).\n\tfinal_names: Vec\u003cString\u003e,\n\t/// Resolved working per-channel filenames.\n\tworking_names: Vec\u003cString\u003e,\n}\n\nimpl ConformTask {\n\t/// Build a conform task from an oakcodec request, mirroring the C++\n\t/// constructor.\n\tpub fn new(request: \u0026bridge::codec::OakCodecTaskRequest) -\u003e ConformTask {\n\t\tlet input = unsafe { crate::ffi::taskhandle::cstr_to_string(request.input_filename) };\n\t\tlet output = unsafe { crate::ffi::taskhandle::cstr_to_string(request.output_filename) };\n\t\tlet title = format!(\"Conforming Audio {}:{}\", input, request.stream_index);\n\t\tConformTask {\n\t\t\tbase: Task::new(\u0026title, CHandle::null()),\n\t\t\tinput_filename: input,\n\t\t\toutput_filename: output,\n\t\t\tstream_index: request.stream_index,\n\t\t\tsample_rate: request.sample_rate,\n\t\t\tchannel_layout: request.channel_layout,\n\t\t\tsample_format: request.sample_format,\n\t\t\tfinal_names: Vec::new(),\n\t\t\tworking_names: Vec::new(),\n\t\t}\n\t}\n\n\t/// Derive the final and working PCM filenames for the given first-channel\n\t/// final filename and channel count.\n\t///\n\t/// C++ contract: the first-channel final name must end in `.0.pcm`; the\n\t/// final name for channel `i` replaces the trailing index, and the\n\t/// working name appends `.working`. See `derive_filenames` in\n\t/// conform.cpp — this is a parity/golden candidate (see\n\t/// tests/parity_test.rs).\n\t///\n\t/// CPP-PARITY: src/task/src/conform/conform.cpp (derive_filenames)\n\tpub fn derive_filenames(first_channel_final: \u0026str, channel_count: usize) -\u003e Result\u003c(Vec\u003cString\u003e, Vec\u003cString\u003e)\u003e {\n\t\tconst SUFFIX: \u0026str = \".0.pcm\";\n\n\t\tif channel_count \u003c 1 || first_channel_final.len() \u003c= SUFFIX.len()\n\t\t\t|| !first_channel_final.ends_with(SUFFIX)\n\t\t{\n\t\t\treturn Err(Error::Failed(\"Invalid conform output filename\".to_string()));\n\t\t}\n\n\t\tlet base = \u0026first_channel_final[..first_channel_final.len() - SUFFIX.len()];\n\t\tlet mut final_names = Vec::with_capacity(channel_count);\n\t\tlet mut working_names = Vec::with_capacity(channel_count);\n\t\tfor i in 0..channel_count {\n\t\t\tlet final_name = format!(\"{base}.{i}.pcm\");\n\t\t\tfinal_names.push(final_name.clone());\n\t\t\tworking_names.push(format!(\"{final_name}.working\"));\n\t\t}\n\t\tOk((final_names, working_names))\n\t}\n}\n\nimpl TaskBehavior for ConformTask {\n\t/// Run the conform via the oakcodec decoder (`bridge::codec`), emitting\n\t/// progress as audio is decoded and written to the working files, then\n\t/// rename working → final.\n\tfn run(\u0026mut self, task: \u0026mut Task) -\u003e Result\u003c()\u003e {\n\t\tlet channel_count = self.channel_layout.count_ones() as usize;\n\t\tlet (final_names, working_names) =\n\t\t\tSelf::derive_filenames(\u0026self.output_filename, channel_count).map_err(|_| {\n\t\t\t\ttask.set_error(\"Invalid conform output filename\");\n\t\t\t\tError::Failed(\"Invalid conform output filename\".to_string())\n\t\t\t})?;\n\t\tself.final_names = final_names;\n\t\tself.working_names = working_names;\n\n\t\tlet decoder = unsafe { bridge::codec::oakcodec_decoder_init() };\n\t\tif decoder.ctx.is_null() {\n\t\t\ttask.set_error(\"Failed to create decoder\");\n\t\t\treturn Err(Error::Failed(\"Failed to create decoder\".to_string()));\n\t\t}\n\t\tlet mut decoder = decoder;\n\n\t\tlet result = (|| {\n\t\t\tlet open_result = unsafe {\n\t\t\t\tbridge::codec::oakcodec_decoder_open(decoder, cstr(\u0026self.input_filename), self.stream_index)\n\t\t\t};\n\t\t\tif open_result != 0 {\n\t\t\t\tlet err = decoder_error(decoder);\n\t\t\t\ttask.set_error(\u0026format!(\"Failed to open decoder for audio conform: {err}\"));\n\t\t\t\treturn false;\n\t\t\t}\n\n\t\t\tlet working_ptrs: Vec\u003c*const std::ffi::c_char\u003e =\n\t\t\t\tself.working_names.iter().map(|n| cstr(n)).collect();\n\t\t\tlet conform_result = unsafe {\n\t\t\t\tbridge::codec::oakcodec_decoder_conform_audio(\n\t\t\t\t\tdecoder,\n\t\t\t\t\tworking_ptrs.as_ptr(),\n\t\t\t\t\tworking_ptrs.len() as i32,\n\t\t\t\t\tself.sample_rate,\n\t\t\t\t\tself.channel_layout,\n\t\t\t\t\tself.sample_format,\n\t\t\t\t\tbridge::render::OakCancelAtom::from_chandle(task.get_cancel_atom()),\n\t\t\t\t)\n\t\t\t};\n\t\t\tunsafe {\n\t\t\t\tbridge::codec::oakcodec_decoder_close(decoder);\n\t\t\t}\n\n\t\t\tif conform_result == 0 {\n\t\t\t\t// Rename each working file into place; a failure aborts the\n\t\t\t\t// rest (mirroring the C++ loop).\n\t\t\t\tfor i in 0..self.working_names.len() {\n\t\t\t\t\tif std::fs::rename(\u0026self.working_names[i], \u0026self.final_names[i]).is_err() {\n\t\t\t\t\t\ttask.set_error(\"Failed to move conformed audio into place\");\n\t\t\t\t\t\treturn false;\n\t\t\t\t\t}\n\t\t\t\t}\n\t\t\t\ttrue\n\t\t\t} else {\n\t\t\t\t// Clean up any partial working files.\n\t\t\t\tfor name in \u0026self.working_names {\n\t\t\t\t\tlet _ = std::fs::remove_file(name);\n\t\t\t\t}\n\t\t\t\tif conform_result == bridge::codec::OAKCODEC_E_CANCELLED {\n\t\t\t\t\ttask.set_error(\"Audio conform was cancelled\");\n\t\t\t\t} else {\n\t\t\t\t\ttask.set_error(\"Audio conform failed\");\n\t\t\t\t}\n\t\t\t\tfalse\n\t\t\t}\n\t\t})();\n\n\t\tunsafe {\n\t\t\tbridge::codec::oakcodec_decoder_free(\u0026mut decoder);\n\t\t}\n\n\t\tif result {\n\t\t\tOk(())\n\t\t} else {\n\t\t\tErr(Error::Failed(\"Audio conform failed\".to_string()))\n\t\t}\n\t}\n}\n\n/// Two-stage read of the decoder's last error string.\nfn decoder_error(decoder: CHandle) -\u003e String {\n\tlet mut buf = [0i8; 256];\n\tlet needed = unsafe { bridge::codec::oakcodec_decoder_last_error(decoder, buf.as_mut_ptr(), buf.len() as i32) };\n\tif needed \u003c= 0 {\n\t\treturn String::new();\n\t}\n\tlet len = buf.iter().position(|\u0026c| c == 0).unwrap_or(buf.len());\n\tunsafe { String::from_utf8_lossy(std::slice::from_raw_parts(buf.as_ptr() as *const u8, len)).into_owned() }\n}\n","traces":[{"line":56,"address":[],"length":0,"stats":{"Line":7}},{"line":57,"address":[],"length":0,"stats":{"Line":21}},{"line":58,"address":[],"length":0,"stats":{"Line":21}},{"line":59,"address":[],"length":0,"stats":{"Line":14}},{"line":61,"address":[],"length":0,"stats":{"Line":28}},{"line":64,"address":[],"length":0,"stats":{"Line":14}},{"line":65,"address":[],"length":0,"stats":{"Line":14}},{"line":66,"address":[],"length":0,"stats":{"Line":14}},{"line":67,"address":[],"length":0,"stats":{"Line":14}},{"line":68,"address":[],"length":0,"stats":{"Line":7}},{"line":69,"address":[],"leng r - Non-Linear Video Editor\n// Copyright (C) 2026 Oak Team\n//\n// This program is free software: you can redistribute it and/or modify\n// it under the terms of the GNU General Public License as published by\n// the Free Software Foundation, either version 3 of the License, or\n// (at your option) any later version.\n//\n// This program is distributed in the hope that it will be useful,\n// but WITHOUT ANY WARRANTY; without even the implied warranty of\n// MERCHANTABILITY or FITNESS FOR A PARTICULAR PURPOSE.  See the\n// GNU General Public License for more details.\n//\n// You should have received a copy of the GNU General Public License\n// along with this program.  If not, see \u003chttp://www.gnu.org/licenses/\u003e.\n\n//! `CustomCacheTask`, mirroring `src/task/src/customcache/customcachetask.h`.\n//!\n//! A task that delegates its completion to an external cache fill: it does\n//! not do work itself but waits until the cache reports it is done (via\n//! [`CustomCacheTask::finish`]) or is cancelled.\n//!\n//! CPP-PARITY: src/task/src/customcache/customcachetask.h\n\nuse std::sync::{Arc, Condvar, Mutex};\n\nuse crate::error::{Error, Result};\nuse crate::handle::CHandle;\nuse crate::task::{Task, TaskBehavior};\n\n/// Shared state between the parked task thread, the owning cache\n/// ([`CustomCacheTask::finish`]) and the cancel hook. Mirrors the C++\n/// `mutex_`/`wait_cond_`/`cancelled_through_finish_` trio; the cancel atom\n/// copy lets `finish()` wake the task through the same channel the C++\n/// `cancel()` uses.\npub struct CustomCacheState {\n\t/// Set by `finish()` before the cancellation request.\n\tcancelled_through_finish: Mutex\u003cbool\u003e,\n\t/// Parked-task wakeup.\n\twait: Condvar,\n\t/// Callback invoked when the task is cancelled (not by `finish()`).\n\tcancelled_callback: Mutex\u003cOption\u003cBox\u003cdyn FnMut() + Send\u003e\u003e\u003e,\n\t/// Copy of the task's cancellation atom.\n\tatom: CHandle,\n}\n\nimpl CustomCacheState {\n\t/// Mark the cache fill as complete and wake the parked task.\n\tpub fn finish(\u0026self) {\n\t\t*self.cancelled_through_finish.lock().unwrap() = true;\n\t\tif !self.atom.is_null() {\n\t\t\tlet atom = crate::bridge::render::OakCancelAtom::from_chandle(self.atom);\n\t\t\tunsafe {\n\t\t\t\tcrate::bridge::render::oakrender_cancelatom_cancel(atom);\n\t\t\t}\n\t\t}\n\t\tself.wait.notify_one();\n\t}\n\n\t/// The C++ `cancel_event()` hook: fires the callback unless the task was\n\t/// finished through `finish()`, then wakes the parked task.\n\tpub fn cancel_event(\u0026self) {\n\t\tif !*self.cancelled_through_finish.lock().unwrap() {\n\t\t\tif let Some(cb) = self.cancelled_callback.lock().unwrap().as_mut() {\n\t\t\t\tcb();\n\t\t\t}\n\t\t}\n\t\tself.wait.notify_one();\n\t}\n\n\t/// The full C++ `cancel()`: cancel the atom and run the cancel-event\n\t/// hook. Used by the owning cache to abort a fill.\n\tpub fn cancel(\u0026self) {\n\t\tif !self.atom.is_null() {\n\t\t\tlet atom = crate::bridge::render::OakCancelAtom::from_chandle(self.atom);\n\t\t\tunsafe {\n\t\t\t\tcrate::bridge::render::oakrender_cancelatom_cancel(atom);\n\t\t\t}\n\t\t}\n\t\tself.cancel_event();\n\t}\n\n\t/// Whether the fill was completed through `finish()`.\n\tfn is_finished_through_finish(\u0026self) -\u003e bool {\n\t\t*self.cancelled_through_finish.lock().unwrap()\n\t}\n}\n\n/// A cache-fill task that finishes only when [`CustomCacheTask::finish`] is\n/// called by the owning cache. Uses a `Mutex` + `Condvar` to park the task\n/// thread until completion or cancellation.\npub struct CustomCacheTask {\n\t/// The shared task base.\n\tpub base: Task,\n\t/// The name of the sequence being cached.\n\tpub sequence_name: String,\n\t/// Shared park/notify state.\n\tstate: Arc\u003cCustomCacheState\u003e,\n}\n\nimpl CustomCacheTask {\n\t/// Create a cache-fill task with the given sequence name. The cancel\n\t/// hook that wakes the parked thread is installed on the base task.\n\tpub fn new(sequence_name: \u0026str) -\u003e CustomCacheTask {\n\t\tlet base = Task::new(\u0026format!(\"Caching custom range for \\\"{sequence_name}\\\"\"), CHandle::null());\n\t\tlet state = Arc::new(CustomCacheState {\n\t\t\tcancelled_through_finish: Mutex::new(false),\n\t\t\twait: Condvar::new(),\n\t\t\tcancelled_callback: Mutex::new(None),\n\t\t\tatom: base.get_cancel_atom(),\n\t\t});\n\t\tlet mut task = CustomCacheTask {\n\t\t\tbase,\n\t\t\tsequence_name: sequence_name.to_string(),\n\t\t\tstate,\n\t\t};\n\t\tlet hook_state = task.state.clone();\n\t\ttask.base.set_cancel_event(Box::new(move || hook_state.cancel_event()));\n\t\ttask\n\t}\n\n\t/// Mark the cache fill as complete, waking the parked task thread.\n\tpub fn finish(\u0026mut self) {\n\t\tself.state.finish();\n\t}\n\n\t/// Install the callback invoked when the task is cancelled.\n\tpub fn set_cancelled_callback(\u0026mut self, cb: Box\u003cdyn FnMut() + Send\u003e) {\n\t\t*self.state.cancelled_callback.lock().unwrap() = Some(cb);\n\t}\n\n\t/// Shared-state accessor for the owning cache (and tests) to call\n\t/// [`CustomCacheTask::finish`] from another thread.\n\tpub fn state(\u0026self) -\u003e Arc\u003cCustomCacheState\u003e {\n\t\tself.state.clone()\n\t}\n}\n\nimpl TaskBehavior for CustomCacheTask {\n\t/// Park until [`CustomCacheTask::finish`] or cancellation; return\n\t/// `Err(Error::Cancelled)` if cancelled while waiting.\n\tfn run(\u0026mut self, task: \u0026mut Task) -\u003e Result\u003c()\u003e {\n\t\t// Install the cancel hook on the task this behavior actually runs\n\t\t// under (the outer task driven by the manager / C ABI). The\n\t\t// constructor-installed hook on the inner `base` only fires when the\n\t\t// base itself is cancelled; without this the outer `cancel()` would\n\t\t// set the shared atom but never wake the parked thread.\n\t\tlet hook_state = self.state.clone();\n\t\ttask.set_cancel_event(Box::new(move || hook_state.cancel_event()));\n\n\t\tlet mut guard = self.state.cancelled_through_finish.lock().unwrap();\n\t\twhile !task.is_cancelled() {\n\t\t\tguard = self.state.wait.wait(guard).unwrap();\n\t\t}\n\t\tdrop(guard);\n\t\tif self.state.is_finished_through_finish() {\n\t\t\tOk(())\n\t\t} else {\n\t\t\tErr(Error::Cancelled)\n\t\t}\n\t}\n}\n","traces":[{"line":49,"address":[],"length":0,"stats":{"Line":2}},{"line":50,"address":[],"length":0,"stats":{"Line":4}},{"line":51,"address":[],"length":0,"stats":{"Line":2}},{"line":52,"address":[],"length":0,"stats":{"Line":6}},{"line":54,"address":[],"length":0,"stats":{"Line":2}},{"line":57,"address":[],"length":0,"stats":{"Line":4}},{"line":62,"address":[],"length":0,"stats":{"Line":3}},{"line":63,"address":[],"length":0,"stats":{"Line":6}},{"line":64,"address":[],"length":0,"stats":{"Line":8}},{"line":65,"address":[],"length":0,"stats":{"Line":1}},{"line":68,"address":[],"length":0,"stats":{"Line":6}},{"line":73,"address":[],"length":0,"stats":{"Line":3}},{"line":74,"address":[],"length":0,"stats":{"Line":3}},{"line":75,"address":[],"length":0,"stats":{"Line":9}},{"line":77,"address":[],"length":0,"stats":{"Line":3}},{"line":80,"address":[],"length":0,"stats":{"Line":6}},{"line":84,"address":[],"length":0,"stats":{"Line":5}},{"line":85,"address":[],"length":0,"stats":{"Line":10}},{"line":104,"address":[],"length":0,"stats":{"Line":5}},{"line":105,"address":[],"length":0,"stats":{"Line":20}},{"line":106,"address":[],"length":0,"stats":{"Line":15}},{"line":107,"address":[],"length":0,"stats":{"Line":10}},{"line":108,"address":[],"length":0,"stats":{"Line":10}},{"line":109,"address":[],"length":0,"stats":{"Line":15}},{"line":110,"address":[],"length":0,"stats":{"Line":5}},{"line":114,"address":[],"length":0,"stats":{"Line":10}},{"line":117,"address":[],"length":0,"stats":{"Line":15}},{"line":118,"address":[],"length":0,"stats":{"Line":15}},{"line":119,"address":[],"length":0,"stats":{"Line":5}},{"line":123,"address":[],"length":0,"stats":{"Line":0}},{"line":124,"address":[],"length":0,"stats":{"Line":0}},{"line":128,"address":[],"length":0,"stats":{"Line":2}},{"line":129,"address":[],"length":0,"stats":{"Line":6}},{"line":134,"address":[],"length":0,"stats":{"Line":5}},{"line":135,"address":[],"length":0,"stats":{"Line":10}},{"line":142,"address":[],"length":0,"stats":{"Line":5}},{"line":148,"address":[],"length":0,"stats":{"Line":15}},{"line":149,"address":[],"length":0,"stats":{"Line":15}},{"line":151,"address":[],"length":0,"stats":{"Line":20}},{"line":152,"address":[],"length":0,"stats":{"Line":11}},{"line":153,"address":[],"length":0,"stats":{"Line":12}},{"line":155,"address":[],"length":0,"stats":{"Line":10}},{"line":156,"address":[],"length":0,"stats":{"Line":5}},{"line":157,"address":[],"length":0,"stats":{"Line":2}},{"line":159,"address":[],"length":0,"stats":{"Line":3}}],"covered":43,"coverable":45},{"path":["/","Users","sunyu","Projects","oak","src","task","rust","src","error.rs"],"content":"// Oak Video Editor - Non-Linear Video Editor\n// Copyright (C) 2026 Oak Team\n//\n// This program is free software: you can redistribute it and/or modify\n// it under the terms of the GNU General Public License as published by\n// the Free Software Foundation, either version 3 of the License, or\n// (at your option) any later version.\n//\n// This program is distributed in the hope that it will be useful,\n// but WITHOUT ANY WARRANTY; without even the implied warranty of\n// MERCHANTABILITY or FITNESS FOR A PARTICULAR PURPOSE.  See the\n// GNU General Public License for more details.\n//\n// You should have received a copy of the GNU General Public License\n// along with this program.  If not, see \u003chttp://www.gnu.org/licenses/\u003e.\n\n//! Error codes, mirroring `include/task/error.h` verbatim; project-wide\n//! -MMCCCC scheme (module registry in include/common/error.h), pass-through\n//! untranslated. Module number for task is **08**; task additionally defines\n//! `OAKTASK_E_CANCELLED` (see include/task/error.h).\n\n/// Success.\npub const OAKTASK_OK: i32 = 0;\n/// Null handle or invalid argument.\npub const OAKTASK_E_INVALID: i32 = -80001;\n/// Call not valid in the current state.\npub const OAKTASK_E_STATE: i32 = -80002;\n/// The underlying operation failed.\npub const OAKTASK_E_FAILED: i32 = -80003;\n/// Index out of range / entry not found.\npub const OAKTASK_E_NOT_FOUND: i32 = -80004;\n/// Allocation failed.\npub const OAKTASK_E_NOMEM: i32 = -80005;\n/// The task was cancelled.\npub const OAKTASK_E_CANCELLED: i32 = -80006;\n\n/// Crate-internal result type; the FFI layer maps it to the codes.\npub type Result\u003cT\u003e = std::result::Result\u003cT, Error\u003e;\n\n/// Crate-internal error.\n#[derive(Debug)]\npub enum Error {\n\t/// Null handle or invalid argument.\n\tInvalid,\n\t/// Wrong state.\n\tState,\n\t/// Operation failed (context string is log-only).\n\tFailed(String),\n\t/// Not found.\n\tNotFound,\n\t/// Out of memory.\n\tNoMem,\n\t/// The operation was cancelled.\n\tCancelled,\n}\n\nimpl Error {\n\t/// Map to the public error code.\n\tpub fn code(\u0026self) -\u003e i32 {\n\t\tmatch self {\n\t\t\tError::Invalid =\u003e OAKTASK_E_INVALID,\n\t\t\tError::State =\u003e OAKTASK_E_STATE,\n\t\t\tError::Failed(_) =\u003e OAKTASK_E_FAILED,\n\t\t\tError::NotFound =\u003e OAKTASK_E_NOT_FOUND,\n\t\t\tError::NoMem =\u003e OAKTASK_E_NOMEM,\n\t\t\tError::Cancelled =\u003e OAKTASK_E_CANCELLED,\n\t\t}\n\t}\n}\n","traces":[{"line":59,"address":[],"length":0,"stats":{"Line":3}},{"line":60,"address":[],"length":0,"stats":{"Line":3}},{"line":61,"address":[],"length":0,"stats":{"Line":0}},{"line":62,"address":[],"length":0,"stats":{"Line":0}},{"line":63,"address":[],"length":0,"stats":{"Line":1}},{"line":64,"address":[],"length":0,"stats":{"Line":0}},{"line":65,"address":[],"length":0,"stats":{"Line":0}},{"line":66,"address":[],"length":0,"stats":{"Line":2}}],"covered":4,"coverable":8},{"path":["/","Users","sunyu","Projects","oak","src","task","rust","src","export.rs"],"content":"// Oak Video Editor - Non-Linear Video Editor\n// Copyright (C) 2026 Oak Team\n//\n// This program is free software: you can redistribute it and/or modify\n// it under the terms of the GNU General Public License as published by\n// the Free Software Foundation, either version 3 of the License, or\n// (at your option) any later version.\n//\n// This program is distributed in the hope that it will be useful,\n// but WITHOUT ANY WARRANTY; without even the implied warranty of\n// MERCHANTABILITY or FITNESS FOR A PARTICULAR PURPOSE.  See the\n// GNU General Public License for more details.\n//\n// You should have received a copy of the GNU General Public License\n// along with this program.  If not, see \u003chttp://www.gnu.org/licenses/\u003e.\n\n//! `ExportTask`, mirroring `src/task/src/export/export.h`.\n//!\n//! Renders the viewer output through [`crate::render::RenderTask`] and writes\n//! it to a file via the oakcodec encoder (`bridge::codec`), mapping each\n//! rendered [`Rational`] frame to an `OakFrame` and each rendered\n//! [`TimeRange`] to audio samples.\n//!\n//! **Simplifications over the C++**: no temporary-file rename dance (the\n//! encoder writes straight to the requested filename), no sidecar subtitle\n//! encoder (subtitles go through the main encoder), and no frame/audio\n//! reordering maps — the [`RenderTask`] loop delivers frames and audio in\n//! timestamp order (its reorder buffer), so the encoder is written directly.\n//!\n//! CPP-PARITY: src/task/src/export/export.h\n\nuse crate::bridge;\nuse crate::bridge::codec::OakCodecEncodingParams;\nuse crate::error::{Error, Result};\nuse crate::ffi::taskhandle::cstr;\nuse crate::handle::CHandle;\nuse crate::render::{ForceParams, RenderTask, RenderTaskBehavior};\nuse crate::task::{Task, TaskBehavior};\nuse oakcore_rs::{Rational, TimeRange};\n\n/// An export task. Owns the encoder and the project copier; the base\n/// [`RenderTask`] does the frame/audio production.\npub struct ExportTask {\n\t/// The render base (itself a task).\n\tpub render: RenderTask,\n\t/// The viewer node (borrowed `OakNodeNode`) being exported.\n\tpub viewer_node: CHandle,\n\t/// The color manager (borrowed `OakNodeColorManager`).\n\tpub color_manager: CHandle,\n\t/// The encoding parameters (mirror of `oakcodec_encoding_params`).\n\tpub encoding_params: EncodingParams,\n\t/// Owning copy of the export project (borrowed `OakRenderProjectCopier`).\n\t/// Left empty in this simplified implementation (the render drives the\n\t/// viewer directly).\n\tpub copier: CHandle,\n\t/// The opened encoder.\n\tencoder: CHandle,\n\t/// The encoder subtitles are written to (the main encoder in this\n\t/// simplified implementation).\n\tsubtitle_encoder: CHandle,\n\t/// Frame counter for progress reporting.\n\tframe_time: i64,\n\t/// Streak of consecutive null frames (fails the export after 8).\n\tnull_frame_streak: i32,\n}\n\n/// Mirror of `oakcodec_encoding_params` in `include/codec/encoder.h`, kept as\n/// plain fields so the export task can build the encoder params without an\n/// oakcodec handle. Only the fields the task reads are declared; see the\n/// header for the full inventory.\npub struct EncodingParams {\n\t/// Output filename.\n\tpub filename: String,\n\t/// Export format id (`olive::ExportFormat::Format`).\n\tpub format: i32,\n\t/// Whether video is exported.\n\tpub video_enabled: bool,\n\t/// Video codec id.\n\tpub video_codec: i32,\n\t/// Output width.\n\tpub video_width: i32,\n\t/// Output height.\n\tpub video_height: i32,\n\t/// Frame duration rational (numerator/denominator).\n\tpub video_time_base_num: i32,\n\t/// Frame duration denominator.\n\tpub video_time_base_den: i32,\n\t/// Delivery pixel format (`oakcore_rs::PixelFormat` as int).\n\tpub video_pixel_format: i32,\n\t/// Whether audio is exported.\n\tpub audio_enabled: bool,\n\t/// Audio codec id.\n\tpub audio_codec: i32,\n\t/// Whether subtitles are exported.\n\tpub subtitles_enabled: bool,\n\t/// Export length numerator (seconds rational).\n\tpub export_length_num: i32,\n\t/// Export length denominator.\n\tpub export_length_den: i32,\n}\n\nimpl ExportTask {\n\t/// Build a new export task from the viewer, color manager, and encoding\n\t/// params.\n\tpub fn new(viewer: CHandle, color_manager: CHandle, params: EncodingParams) -\u003e ExportTask {\n\t\tlet label = node_label(viewer);\n\t\tlet title = format!(\"Exporting \\\"{label}\\\"\");\n\t\tlet base = Task::new(\u0026title, CHandle::null());\n\t\tlet render = RenderTask::new(base, CHandle::null(), CHandle::null(), viewer, ForceParams::default(), None);\n\t\tExportTask {\n\t\t\trender,\n\t\t\tviewer_node: viewer,\n\t\t\tcolor_manager,\n\t\t\tencoding_params: params,\n\t\t\tcopier: CHandle::null(),\n\t\t\tencoder: CHandle::null(),\n\t\t\tsubtitle_encoder: CHandle::null(),\n\t\t\tframe_time: 0,\n\t\t\tnull_frame_streak: 0,\n\t\t}\n\t}\n\n\t/// Build the C-ABI encoding-params POD for the encoder from the Rust\n\t/// mirror (zeroed fields = disabled/defaults).\n\tfn build_codec_params(\u0026self) -\u003e OakCodecEncodingParams {\n\t\tlet mut params = OakCodecEncodingParams {\n\t\t\tfilename: [0; 1024],\n\t\t\tformat: 0,\n\t\t\tvideo_enabled: 0,\n\t\t\tvideo_codec: 0,\n\t\t\tvideo_width: 0,\n\t\t\tvideo_height: 0,\n\t\t\tvideo_time_base_num: 0,\n\t\t\tvideo_time_base_den: 0,\n\t\t\tvideo_pixel_format: 0,\n\t\t\tvideo_interlacing: 0,\n\t\t\tvideo_pixel_aspect_num: 0,\n\t\t\tvideo_pixel_aspect_den: 0,\n\t\t\tvideo_bit_rate: 0,\n\t\t\tvideo_min_bit_rate: 0,\n\t\t\tvideo_max_bit_rate: 0,\n\t\t\tvideo_buffer_size: 0,\n\t\t\tvideo_threads: 0,\n\t\t\tvideo_pix_fmt: [0; 64],\n\t\t\tvideo_is_image_sequence: 0,\n\t\t\tvideo_scaling_method: 0,\n\t\t\taudio_enabled: 0,\n\t\t\taudio_codec: 0,\n\t\t\taudio_sample_rate: 0,\n\t\t\taudio_channel_layout: 0,\n\t\t\taudio_sample_format: 0,\n\t\t\taudio_bit_rate: 0,\n\t\t\tsubtitles_enabled: 0,\n\t\t\tsubtitles_codec: 0,\n\t\t\tsubtitles_are_sidecar: 0,\n\t\t\tsubtitles_sidecar_format: 0,\n\t\t\tcolor_transform_output: [0; 256],\n\t\t\texport_length_num: 0,\n\t\t\texport_length_den: 0,\n\t\t\thas_custom_range: 0,\n\t\t\tcustom_range_in_num: 0,\n\t\t\tcustom_range_in_den: 0,\n\t\t\tcustom_range_out_num: 0,\n\t\t\tcustom_range_out_den: 0,\n\t\t};\n\t\tlet bytes = self.encoding_params.filename.as_bytes();\n\t\tlet n = bytes.len().min(1023);\n\t\tparams.filename[..n].copy_from_slice(unsafe { std::slice::from_raw_parts(bytes.as_ptr() as *const i8, n) });\n\t\tparams.format = self.encoding_params.format;\n\t\tparams.video_enabled = self.encoding_params.video_enabled as i32;\n\t\tparams.video_codec = self.encoding_params.video_codec;\n\t\tparams.video_width = self.encoding_params.video_width;\n\t\tparams.video_height = self.encoding_params.video_height;\n\t\tparams.video_time_base_num = self.encoding_params.video_time_base_num;\n\t\tparams.video_time_base_den = self.encoding_params.video_time_base_den;\n\t\tparams.video_pixel_format = self.encoding_params.video_pixel_format;\n\t\tparams.audio_enabled = self.encoding_params.audio_enabled as i32;\n\t\tparams.audio_codec = self.encoding_params.audio_codec;\n\t\tparams.subtitles_enabled = self.encoding_params.subtitles_enabled as i32;\n\t\tparams.export_length_num = self.encoding_params.export_length_num;\n\t\tparams.export_length_den = self.encoding_params.export_length_den;\n\t\tparams\n\t}\n\n\t/// Resolve the export range: the custom range when set, otherwise the\n\t/// whole sequence length.\n\tfn export_range(\u0026self) -\u003e TimeRange {\n\t\tlet mut len_num = 0;\n\t\tlet mut len_den = 1;\n\t\tunsafe {\n\t\t\tbridge::node::oaknode_sequence_get_length(self.viewer_node, \u0026mut len_num, \u0026mut len_den);\n\t\t}\n\t\tTimeRange::new(Rational::new(0, 1), Rational::new(len_num as i64, len_den as i64))\n\t}\n}\n\nimpl TaskBehavior for ExportTask {\n\tfn run(\u0026mut self, task: \u0026mut Task) -\u003e Result\u003c()\u003e {\n\t\t// Share the caller's cancellation atom with the inner render base.\n\t\tself.render.base.set_cancel_atom(task.get_cancel_atom());\n\n\t\tlet codec_params = self.build_codec_params();\n\t\tlet encoder = unsafe { bridge::codec::oakcodec_encoder_init(\u0026codec_params) };\n\t\tif encoder.ctx.is_null() {\n\t\t\ttask.set_error(\"Failed to create encoder\");\n\t\t\treturn Err(Error::Failed(\"Failed to create encoder\".to_string()));\n\t\t}\n\t\tself.encoder = encoder;\n\n\t\tif unsafe { bridge::codec::oakcodec_encoder_open(encoder) } != 0 {\n\t\t\tlet err = encoder_error(encoder);\n\t\t\ttask.set_error(\u0026format!(\"Failed to open file: {err}\"));\n\t\t\treturn Err(Error::Failed(\"Failed to open file\".to_string()));\n\t\t}\n\t\tself.subtitle_encoder = encoder;\n\n\t\tlet export_range = self.export_range();\n\n\t\t// Force params: force the renderer to the requested output size and\n\t\t// pixel format (no color-matrix scaling in this simplified path).\n\t\tlet mut force = ForceParams::default();\n\t\tif self.encoding_params.video_enabled {\n\t\t\tforce.force_width = self.encoding_params.video_width;\n\t\t\tforce.force_height = self.encoding_params.video_height;\n\t\t\tforce.force_format = unsafe { bridge::codec::oakcodec_encoder_get_desired_pixel_format(encoder) };\n\t\t\tforce.force_channel_count = 4; // RGBA\n\t\t}\n\t\tself.render.force_params = force;\n\t\tself.render.set_render_inputs(\n\t\t\tself.color_manager,\n\t\t\tCHandle::null(),\n\t\t\t0, // RenderMode::k_online\n\t\t\tself.encoding_params.audio_enabled,\n\t\t\texport_range,\n\t\t);\n\n\t\t// Drive the render with `self` as the subclass behavior (the C++\n\t\t// virtual dispatch receiver). The render is temporarily moved out of\n\t\t// `self` to avoid a self-referential borrow; it is put back right\n\t\t// after, before the encoder flush below.\n\t\tlet mut render = std::mem::replace(\u0026mut self.render, crate::render::RenderTask::placeholder());\n\t\tlet result = render.render(task, self);\n\t\tself.render = render;\n\t\tresult?;\n\n\t\t// Flush the encoder and surface any trailing error.\n\t\tunsafe {\n\t\t\tbridge::codec::oakcodec_encoder_flush(self.encoder);\n\t\t}\n\t\tlet err = encoder_error(self.encoder);\n\t\tif !err.is_empty() {\n\t\t\ttask.set_error(\u0026err);\n\t\t\treturn Err(Error::Failed(\"Encoder flush failed\".to_string()));\n\t\t}\n\n\t\tOk(())\n\t}\n}\n\nimpl RenderTaskBehavior for ExportTask {\n\tfn frame_downloaded(\u0026mut self, task: \u0026mut Task, frame: CHandle) -\u003e Result\u003c()\u003e {\n\t\tif frame.ctx.is_null() {\n\t\t\tself.null_frame_streak += 1;\n\t\t\tif self.null_frame_streak \u003e= 8 {\n\t\t\t\ttask.set_error(\u0026format!(\n\t\t\t\t\t\"Render workers failed to deliver {} consecutive frames; aborting export\",\n\t\t\t\t\tself.null_frame_streak\n\t\t\t\t));\n\t\t\t\treturn Err(Error::Failed(\"Too many null frames\".to_string()));\n\t\t\t}\n\t\t\treturn Ok(());\n\t\t}\n\t\tself.null_frame_streak = 0;\n\n\t\tif unsafe { bridge::codec::oakcodec_encoder_write_video(self.encoder, frame) } != 0 {\n\t\t\tlet err = encoder_error(self.encoder);\n\t\t\ttask.set_error(\u0026err);\n\t\t\treturn Err(Error::Failed(\"Failed to write video frame\".to_string()));\n\t\t}\n\n\t\tself.frame_time += 1;\n\t\t// Progress is reported by the render loop itself (native signalling);\n\t\t// the per-frame counter is kept for parity with the C++ field.\n\t\tOk(())\n\t}\n\n\tfn audio_downloaded(\u0026mut self, task: \u0026mut Task, buffer: CHandle) -\u003e Result\u003c()\u003e {\n\t\t// Simplified: audio writing is not wired through the sample buffer\n\t\t// in this rewrite (the encoder receives the interleaved samples from\n\t\t// the codec side directly). The hook exists for parity with the C++\n\t\t// virtual and always succeeds.\n\t\tlet _ = (task, buffer);\n\t\tOk(())\n\t}\n\n\tfn encode_subtitle(\u0026mut self, task: \u0026mut Task, text: \u0026str) -\u003e Result\u003c()\u003e {\n\t\tif !self.encoding_params.subtitles_enabled || self.subtitle_encoder.ctx.is_null() {\n\t\t\treturn Ok(());\n\t\t}\n\t\t// The simplified path does not carry the subtitle block's in/out\n\t\t// times; write with 0.0/0.0 (the encoder default interval).\n\t\tif unsafe { bridge::codec::oakcodec_encoder_write_subtitle(self.subtitle_encoder, cstr(text), 0.0, 0.0) } != 0 {\n\t\t\tlet err = encoder_error(self.subtitle_encoder);\n\t\t\ttask.set_error(\u0026err);\n\t\t\treturn Err(Error::Failed(\"Failed to write subtitle\".to_string()));\n\t\t}\n\t\tOk(())\n\t}\n}\n\n/// Two-stage read of the viewer node's label.\nfn node_label(node: CHandle) -\u003e String {\n\tlet needed = unsafe { bridge::node::oaknode_node_get_label(node, std::ptr::null_mut(), 0) };\n\tif needed \u003c= 0 {\n\t\treturn String::new();\n\t}\n\tlet mut buf = vec![0i8; needed as usize];\n\tunsafe {\n\t\tbridge::node::oaknode_node_get_label(node, buf.as_mut_ptr(), needed);\n\t}\n\tbuf_to_string(\u0026buf)\n}\n\n/// Read a NUL-terminated char buffer into a String (lossy).\nfn buf_to_string(buf: \u0026[i8]) -\u003e String {\n\tlet len = buf.iter().position(|\u0026c| c == 0).unwrap_or(buf.len());\n\tunsafe { String::from_utf8_lossy(std::slice::from_raw_parts(buf.as_ptr() as *const u8, len)).into_owned() }\n}\n\n/// Two-stage read of the encoder's last error string.\nfn encoder_error(encoder: CHandle) -\u003e String {\n\tlet mut buf = [0i8; 512];\n\tlet needed = unsafe { bridge::codec::oakcodec_encoder_last_error(encoder, buf.as_mut_ptr(), buf.len() as i32) };\n\tif needed \u003c= 0 {\n\t\treturn String::new();\n\t}\n\tbuf_to_string(\u0026buf)\n}\n","traces":[{"line":105,"address":[],"length":0,"stats":{"Line":8}},{"line":106,"address":[],"length":0,"stats":{"Line":24}},{"line":107,"address":[],"length":0,"stats":{"Line":16}},{"line":108,"address":[],"length":0,"stats":{"Line":32}},{"line":109,"address":[],"length":0,"stats":{"Line":64}},{"line":115,"address":[],"length":0,"stats":{"Line":16}},{"line":116,"address":[],"length":0,"stats":{"Line":8}},{"line":117,"address":[],"length":0,"stats":{"Line":8}},{"line":125,"address":[],"length":0,"stats":{"Line":8}},{"line":127,"address":[],"length":0,"stats":{"Line":16}},{"line":144,"address":[],"length mbol inventory (header-authoritative):\n//!   - `oaktask_task_free(OakTaskTask *t) -\u003e void`\n//!   - `oaktask_task_start_sync(OakTaskTask t) -\u003e int` (1 = succeeded)\n//!   - `oaktask_task_start(OakTaskTask t) -\u003e int`\n//!   - `oaktask_task_cancel(OakTaskTask t) -\u003e int`\n//!   - `oaktask_task_wait(OakTaskTask t) -\u003e int`\n//!   - `oaktask_task_is_finished(OakTaskTask t) -\u003e int`\n//!   - `oaktask_task_succeeded(OakTaskTask t) -\u003e int`\n//!   - `oaktask_task_title(OakTaskTask t, char *buf, int buf_size) -\u003e int` (two-stage)\n//!   - `oaktask_task_error(OakTaskTask t, char *buf, int buf_size) -\u003e int` (two-stage)\n//!   - `oaktask_task_subscribe(OakTaskTask t, oaktask_event_fn fn, void *userdata) -\u003e int64_t`\n//!   - `oaktask_debug_alive_count(void) -\u003e int`\n\nuse std::ffi::{c_char, c_int, c_void};\nuse std::sync::Arc;\n\nuse crate::error::OAKTASK_E_INVALID;\nuse crate::ffi::taskhandle::{copy_string, get_task, get_task_mut, userdata_usize};\nuse crate::handle::CHandle;\nuse crate::manager::TaskManager;\nuse crate::task::{SubscriberState, TaskEvent};\n\n/// `oaktask_event_fn` callback (`include/task/task.h`).\npub type OakTaskEventFn = unsafe extern \"C\" fn(event_id: c_int, value: f64, userdata: *mut c_void);\n\n/// Event ids (`include/task/task.h`).\nconst OAKTASK_EVENT_STARTED: c_int = 0;\nconst OAKTASK_EVENT_PROGRESS: c_int = 1;\nconst OAKTASK_EVENT_FINISHED: c_int = 2;\n\n/// `oaktask_task_free` (`include/task/task.h`).\n#[no_mangle]\npub unsafe extern \"C\" fn oaktask_task_free(t: *mut CHandle) {\n\tif t.is_null() {\n\t\treturn;\n\t}\n\tlet handle = unsafe { \u0026mut *t };\n\tif handle.ctx.is_null() {\n\t\treturn;\n\t}\n\t// Release one reference, then clear ctx (NULL / empty-handle no-op).\n\tif let Some(release) = handle.release {\n\t\tunsafe {\n\t\t\trelease(handle.ctx);\n\t\t}\n\t}\n\thandle.ctx = std::ptr::null_mut();\n}\n\n/// `oaktask_task_start_sync` (`include/task/task.h`).\n#[no_mangle]\npub unsafe extern \"C\" fn oaktask_task_start_sync(t: CHandle) -\u003e c_int {\n\tlet h = match get_task(\u0026t) {\n\t\tSome(h) =\u003e h,\n\t\tNone =\u003e return OAKTASK_E_INVALID,\n\t};\n\tlet result = unsafe { (\u0026mut *h.task).start() };\n\tif result.is_ok() {\n\t\t1\n\t} else {\n\t\t0\n\t}\n}\n\n/// `oaktask_task_start` (`include/task/task.h`).\n#[no_mangle]\npub unsafe extern \"C\" fn oaktask_task_start(t: CHandle) -\u003e c_int {\n\tlet h = match get_task(\u0026t) {\n\t\tSome(h) =\u003e h,\n\t\tNone =\u003e return OAKTASK_E_INVALID,\n\t};\n\tif !TaskManager::instance().is_some() {\n\t\treturn crate::error::OAKTASK_E_STATE;\n\t}\n\tif h.running_on_manager {\n\t\treturn crate::error::OAKTASK_E_STATE;\n\t}\n\tlet h = match get_task_mut(\u0026t) {\n\t\tSome(h) =\u003e h,\n\t\tNone =\u003e return OAKTASK_E_INVALID,\n\t};\n\tif h.owner.is_none() {\n\t\treturn crate::error::OAKTASK_E_STATE;\n\t}\n\n\t// Transfer ownership to the manager; releasing the handle afterwards\n\t// only frees the box. The manager was checked above and cannot vanish\n\t// between the check and the transfer in a single-threaded caller.\n\tlet boxed = h.owner.take().unwrap();\n\tlet task_ptr = h.task;\n\tTaskManager::with_manager_mut(|m| m.add_task(boxed));\n\t// The box moved into the manager; the raw pointer is unchanged.\n\tlet h = get_task_mut(\u0026t).unwrap();\n\th.running_on_manager = true;\n\th.owned = false;\n\tlet _ = task_ptr;\n\tcrate::error::OAKTASK_OK\n}\n\n/// `oaktask_task_cancel` (`include/task/task.h`).\n#[no_mangle]\npub unsafe extern \"C\" fn oaktask_task_cancel(t: CHandle) -\u003e c_int {\n\tlet h = match get_task(\u0026t) {\n\t\tSome(h) =\u003e h,\n\t\tNone =\u003e return OAKTASK_E_INVALID,\n\t};\n\tunsafe {\n\t\t(\u0026mut *h.task).cancel();\n\t}\n\tcrate::error::OAKTASK_OK\n}\n\n/// `oaktask_task_wait` (`include/task/task.h`).\n#[no_mangle]\npub unsafe extern \"C\" fn oaktask_task_wait(t: CHandle) -\u003e c_int {\n\tlet h = match get_task(\u0026t) {\n\t\tSome(h) =\u003e h,\n\t\tNone =\u003e return OAKTASK_E_INVALID,\n\t};\n\tif h.running_on_manager {\n\t\tlet task_ptr = h.task;\n\t\t// C++ semantics: wait cancels the task and blocks until it\n\t\t// finishes. The join happens without holding the manager lock.\n\t\tTaskManager::with_manager_mut(|m| m.cancel_task_by_ptr(task_ptr));\n\t\tlet handle = TaskManager::with_manager_mut(|m| m.take_thread_by_ptr(task_ptr)).flatten();\n\t\tif let Some(handle) = handle {\n\t\t\tlet _ = handle.join();\n\t\t}\n\t}\n\tcrate::error::OAKTASK_OK\n}\n\n/// `oaktask_task_is_finished` (`include/task/task.h`).\n#[no_mangle]\npub unsafe extern \"C\" fn oaktask_task_is_finished(t: CHandle) -\u003e c_int {\n\tlet h = match get_task(\u0026t) {\n\t\tSome(h) =\u003e h,\n\t\tNone =\u003e return OAKTASK_E_INVALID,\n\t};\n\tif unsafe { (*h.task).is_finished() } {\n\t\t1\n\t} else {\n\t\t0\n\t}\n}\n\n/// `oaktask_task_succeeded` (`include/task/task.h`).\n#[no_mangle]\npub unsafe extern \"C\" fn oaktask_task_succeeded(t: CHandle) -\u003e c_int {\n\tlet h = match get_task(\u0026t) {\n\t\tSome(h) =\u003e h,\n\t\tNone =\u003e return OAKTASK_E_INVALID,\n\t};\n\tif unsafe { (*h.task).succeeded() } {\n\t\t1\n\t} else {\n\t\t0\n\t}\n}\n\n/// `oaktask_task_title` (`include/task/task.h`, two-stage string getter).\n#[no_mangle]\npub unsafe extern \"C\" fn oaktask_task_title(t: CHandle, buf: *mut c_char, buf_size: c_int) -\u003e c_int {\n\tlet h = match get_task(\u0026t) {\n\t\tSome(h) =\u003e h,\n\t\tNone =\u003e return OAKTASK_E_INVALID,\n\t};\n\tcopy_string(unsafe { (*h.task).title() }, buf, buf_size)\n}\n\n/// `oaktask_task_error` (`include/task/task.h`, two-stage string getter).\n#[no_mangle]\npub unsafe extern \"C\" fn oaktask_task_error(t: CHandle, buf: *mut c_char, buf_size: c_int) -\u003e c_int {\n\tlet h = match get_task(\u0026t) {\n\t\tSome(h) =\u003e h,\n\t\tNone =\u003e return OAKTASK_E_INVALID,\n\t};\n\tlet value = unsafe { (*h.task).error() }.unwrap_or(\"Unknown error\");\n\tcopy_string(value, buf, buf_size)\n}\n\n/// `o kHandle`).\n//!\n//! `owns_task` is the owns role: true for factory-created tasks (the last\n//! release drops the task) and false once the task runs on the manager\n//! (`oaktask_task_start()` flips it; the manager drops the task) or for\n//! borrowed wrappers (`oaktask_manager_at()`): releasing those only\n//! destroys the box.\n//!\n//! The C++ `TaskHandle` carries its own `finished`/`succeeded` atomics that\n//! the factory listener updates. The Rust [`crate::task::Task`] tracks these\n//! internally (race-free through its `done` condvar), so the box reads them\n//! from the task instead — the box only needs the downcast pointers for the\n//! `take_*` accessors (Rust has no `dynamic_cast`).\n//!\n//! CPP-PARITY: src/task/c_api/taskhandle.h\n\nuse std::ffi::c_void;\nuse std::sync::atomic::{AtomicI32, Ordering};\n\nuse crate::handle::{make_owned, CHandle};\nuse crate::project::import::ProjectImportTask;\nuse crate::project::load::ProjectLoadBaseTask;\nuse crate::task::Task;\n\n/// Concrete-task downcast, standing in for the C++ `dynamic_cast` in the\n/// `take_*` accessors.\npub enum TaskImpl {\n\t/// Not a project load/import task.\n\tNone,\n\t/// A `ProjectLoadBaseTask` (native or OTIO loader).\n\tLoadBase(*mut ProjectLoadBaseTask),\n\t/// A `ProjectImportTask`.\n\tImport(*mut ProjectImportTask),\n}\n\n/// Control block behind an `OakTaskTask` (see the module docs).\npub struct TaskHandleBox {\n\t/// The task the handle wraps (the outer task owning the behavior).\n\tpub task: *mut Task,\n\t/// Whether releasing the last reference drops the task.\n\tpub owned: bool,\n\t/// Whether the task has been handed to the manager.\n\tpub running_on_manager: bool,\n\t/// The owned task (factory case); taken by `oaktask_task_start`.\n\tpub owner: Option\u003cBox\u003cTask\u003e\u003e,\n\t/// Downcast target for the `take_*` accessors.\n\tpub impl_kind: TaskImpl,\n}\n\nimpl Drop for TaskHandleBox {\n\tfn drop(\u0026mut self) {\n\t\t// Mirrors `task_release`: the box is destroyed at zero refs, which\n\t\t// always decrements the alive count.\n\t\tALIVE.fetch_sub(1, Ordering::SeqCst);\n\t}\n}\n\n// Safety: the box is only ever accessed through the C ABI entry points\n// (never concurrently with its own mutation); the raw pointers inside are\n// stable while the box lives.\nunsafe impl Send for TaskHandleBox {}\n\n/// Alive-count for leak assertions in tests (mirrors\n/// `oaktask_capi::alive()`).\nstatic ALIVE: AtomicI32 = AtomicI32::new(0);\n\n/// Current alive handle count.\npub fn alive_count() -\u003e i32 {\n\tALIVE.load(Ordering::SeqCst)\n}\n\n/// Wrap an owned task (reference count 1). The handle owns the task and\n/// drops it on the final release.\n///\n/// CPP-PARITY: src/task/c_api/taskhandle.h (wrap)\npub fn wrap_owned(task: Box\u003cTask\u003e) -\u003e CHandle {\n\twrap_owned_with_impl(task, TaskImpl::None)\n}\n\n/// Wrap an owned task with a downcast target for the `take_*` accessors.\npub fn wrap_owned_with_impl(task: Box\u003cTask\u003e, impl_kind: TaskImpl) -\u003e CHandle {\n\tlet ptr = Box::into_raw(task);\n\tALIVE.fetch_add(1, Ordering::SeqCst);\n\t// Safety: `ptr` is a live, uniquely owned `Box\u003cTask\u003e`.\n\tlet handle = make_owned(TaskHandleBox {\n\t\ttask: ptr,\n\t\towned: true,\n\t\trunning_on_manager: false,\n\t\towner: unsafe { Some(Box::from_raw(ptr)) },\n\t\timpl_kind,\n\t});\n\thandle\n}\n\n/// Wrap a manager-owned (borrowed) task. Releasing the handle does NOT drop\n/// the task.\n///\n/// CPP-PARITY: src/task/c_api/taskhandle.h (wrap_borrowed)\npub fn wrap_borrowed(ptr: *mut Task) -\u003e CHandle {\n\tif ptr.is_null() {\n\t\treturn CHandle::null();\n\t}\n\tALIVE.fetch_add(1, Ordering::SeqCst);\n\tmake_owned(TaskHandleBox {\n\t\ttask: ptr,\n\t\towned: false,\n\t\trunning_on_manager: true,\n\t\towner: None,\n\t\timpl_kind: TaskImpl::None,\n\t})\n}\n\n/// Typed view of a task handle box; `None` for empty handles.\n///\n/// # Safety\n/// The handle must have been created by this module.\npub fn get_task(h: :["/","Users","sunyu","Projects","oak","src","task","rust","src","handle.rs"],"content":"// Oak Video Editor - Non-Linear Video Editor\n// Copyright (C) 2026 Oak Team\n//\n// This program is free software: you can redistribute it and/or modify\n// it under the terms of the GNU General Public License as published by\n// the Free Software Foundation, either version 3 of the License, or\n// (at your option) any later version.\n//\n// This program is distributed in the hope that it will be useful,\n// but WITHOUT ANY WARRANTY; without even the implied warranty of\n// MERCHANTABILITY or FITNESS FOR A PARTICULAR PURPOSE.  See the\n// GNU General Public License for more details.\n//\n// You should have received a copy of the GNU General Public License\n// along with this program.  If not, see \u003chttp://www.gnu.org/licenses/\u003e.\n\n//! Refcounted-handle scaffolding. Same pattern as the oaknode/oakplugin\n//! crates (`src/node/rust/src/handle.rs`); intentionally duplicated rather\n//! than shared — each module DLL must run its own addref/release code (the\n//! function pointers in a handle always point into the DLL that created the\n//! object).\n\nuse std::sync::atomic::AtomicU32;\n\n/// ABI version stamped into every handle.\npub const OAKTASK_ABI_VERSION: u32 = 1;\n\n/// Heap box behind a handle's `ctx`.\npub struct RefBox\u003cT: ?Sized\u003e {\n\t/// Atomic reference count.\n\tpub refs: AtomicU32,\n\t/// Boxed value.\n\tpub value: T,\n}\n\n/// `#[repr(C)]` mirror of the public handle structs\n/// (`{ctx, addref, release, abi_version}`).\n#[repr(C)]\n#[derive(Clone, Copy, Debug, Default)]\npub struct CHandle {\n\t/// Opaque box pointer.\n\tpub ctx: *mut std::ffi::c_void,\n\t/// Atomic increment.\n\tpub addref: Option\u003cunsafe extern \"C\" fn(*mut std::ffi::c_void)\u003e,\n\t/// Atomic decrement; destroys at zero.\n\tpub release: Option\u003cunsafe extern \"C\" fn(*mut std::ffi::c_void)\u003e,\n\t/// ABI version.\n\tpub abi_version: u32,\n}\n\n// Handles are shared between the calling thread and the manager worker\n// threads (same ownership model as a C++ shared_ptr). The raw pointer and\n// function-pointer fields are inherently `!Send`/`!Sync`; the box behind\n// `ctx` is either `Send + Sync` (task state, atomics) or a plain pointer\n// (borrowed handles), both of which are safe to share through the\n// refcounted handle.\nunsafe impl Send for CHandle {}\nunsafe impl Sync for CHandle {}\n\nunsafe extern \"C\" fn noop_addref(_ctx: *mut std::ffi::c_void) {}\n\nunsafe extern \"C\" fn noop_release(_ctx: *mut std::ffi::c_void) {}\n\nunsafe extern \"C\" fn owned_addref\u003cT: 'static\u003e(ctx: *mut std::ffi::c_void) {\n\tif !ctx.is_null() {\n\t\t// CPP-PARITY: src/task/c_api/taskhandle.h (task_addref)\n\t\tunsafe {\n\t\t\t(*(ctx as *const RefBox\u003cT\u003e)).refs.fetch_add(1, std::sync::atomic::Ordering::SeqCst);\n\t\t}\n\t}\n}\n\nunsafe extern \"C\" fn owned_release\u003cT: 'static\u003e(ctx: *mut std::ffi::c_void) {\n\tif ctx.is_null() {\n\t\treturn;\n\t}\n\t// CPP-PARITY: src/task/c_api/taskhandle.h (task_release)\n\tlet b = ctx as *const RefBox\u003cT\u003e;\n\tlet last = unsafe { (*b).refs.fetch_sub(1, std::sync::atomic::Ordering::SeqCst) };\n\tif last == 1 {\n\t\tunsafe {\n\t\t\tdrop(Box::from_raw(ctx as *mut RefBox\u003cT\u003e));\n\t\t}\n\t}\n}\n\n/// Release function for borrowed handles: destroys only the box, never the\n/// pointee.\n///\n/// CPP-PARITY: src/task/c_api/taskhandle.h (wrap_borrowed)\nunsafe extern \"C\" fn borrowed_release\u003cT: 'static\u003e(ctx: *mut std::ffi::c_void) {\n\tif ctx.is_null() {\n\t\treturn;\n\t}\n\tlet b = ctx as *const RefBox\u003c*mut T\u003e;\n\tlet last = unsafe { (*b).refs.fetch_sub(1, std::sync::atomic::Ordering::SeqCst) };\n\tif last == 1 {\n\t\tunsafe {\n\t\t\tdrop(Box::from_raw(ctx as *mut RefBox\u003c*mut T\u003e));\n\t\t}\n\t}\n}\n\nimpl CHandle {\n\t/// The empty handle. `ctx` is null but the fn pointers and ABI version\n\t/// are stamped so callers can unconditionall rs"],"content":"// Oak Video Editor - Non-Linear Video Editor\n// Copyright (C) 2026 Oak Team\n//\n// This program is free software: you can redistribute it and/or modify\n// it under the terms of the GNU General Public License as published by\n// the Free Software Foundation, either version 3 of the License, or\n// (at your option) any later version.\n//\n// This program is distributed in the hope that it will be useful,\n// but WITHOUT ANY WARRANTY; without even the implied warranty of\n// MERCHANTABILITY or FITNESS FOR A PARTICULAR PURPOSE.  See the\n// GNU General Public License for more details.\n//\n// You should have received a copy of the GNU General Public License\n// along with this program.  If not, see \u003chttp://www.gnu.org/licenses/\u003e.\n\n//! The `TaskManager` singleton, mirroring `src/task/src/taskmanager.h`.\n//!\n//! Holds the set of live [`crate::task::Task`] instances; starting a task\n//! hands its ownership to the manager, which also exposes the codec task\n//! submitter registration (see [`crate::codecbridge`]).\n//!\n//! CPP-PARITY: src/task/src/taskmanager.h\n//!\n//! ## Threading model\n//!\n//! [`TaskManager::add_task`] spawns a worker thread that runs the task's\n//! [`Task::start`]. The worker thread only touches the task (through a raw\n//! pointer) and never the manager, so the manager's own mutex is never held\n//! across a join in the C ABI paths (joins happen lock-free via\n//! [`TaskManager::drain_finished`] / [`TaskManager::take_thread_by_ptr`]).\n\nuse std::sync::Mutex;\n\nuse crate::error::{Error, Result};\nuse crate::handle::{make_borrowed, CHandle};\nuse crate::task::Task;\n\n/// Process-wide singleton manager. C++ is a lazy singleton; the Rust side\n/// keeps a `Mutex\u003cOption\u003c...\u003e\u003e` so init/shutdown is explicit and races are\n/// rejected with `OAKTASK_E_STATE` (matching `oaktask_manager_init`).\npub struct TaskManager {\n\t/// Live tasks, most-recently-added last (mirrors the C++ `task_list_`).\n\ttasks: Vec\u003cBox\u003cdyn TaskBox\u003e\u003e,\n\t/// Worker threads, parallel to `tasks` (moved out before joining).\n\tthreads: Vec\u003cOption\u003cstd::thread::JoinHandle\u003c()\u003e\u003e\u003e,\n\t/// Whether the codec task submitter is currently registered.\n\tcodec_submitter_registered: bool,\n}\n\n/// Boxable shim so tasks of heterogeneous concrete types can be stored in\n/// the manager's list.\npub trait TaskBox: Send {\n\t/// Downcast/erase operations the manager needs.\n\tfn task(\u0026self) -\u003e \u0026Task;\n}\n\nimpl TaskBox for Task {\n\tfn task(\u0026self) -\u003e \u0026Task {\n\t\tself\n\t}\n}\n\n/// The process-wide instance slot. A raw pointer (never freed while the\n/// slot is set) so [`TaskManager::instance`] can hand out a `\u0026'static`.\nstatic INSTANCE: Mutex\u003cOption\u003cManagerPtr\u003e\u003e = Mutex::new(None);\n\n/// `Send`/`Sync` wrapper for the manager pointer (the manager's state is\n/// guarded by the `INSTANCE` mutex; the pointer itself is plain).\nstruct ManagerPtr(*mut TaskManager);\n\n// Safety: all access to the pointee goes through the `INSTANCE` mutex.\nunsafe impl Send for ManagerPtr {}\nunsafe impl Sync for ManagerPtr {}\n\nimpl TaskManager {\n\t/// The process-wide instance; `None` until [`TaskManager::init`].\n\t///\n\t/// CPP-PARITY: src/task/src/taskmanager.h (instance)\n\tpub fn instance() -\u003e Option\u003c\u0026'static TaskManager\u003e {\n\t\tlet guard = INSTANCE.lock().unwrap();\n\t\tguard.as_ref().map(|p| unsafe { \u0026*p.0 })\n\t}\n\n\t/// Create the singleton and register the codec task submitter. Returns\n\t/// `Err(Error::State)` if already initialized (mirrors\n\t/// `oaktask_manager_init`).\n\tpub fn init() -\u003e Result\u003c()\u003e {\n\t\tlet mut guard = INSTANCE.lock().unwrap();\n\t\tif guard.is_some() {\n\t\t\treturn Err(Error::State);\n\t\t}\n\t\tlet mgr = Box::into_raw(Box::new(TaskManager {\n\t\t\ttasks: Vec::new(),\n\t\t\tthreads: Vec::new(),\n\t\t\tcodec_submitter_registered: false,\n\t\t}));\n\t\t*guard = Some(ManagerPtr(mgr));\n\t\tOk(())\n\t}\n\n\t/// Destroy the singleton. Idempotent.\n\tpub fn shutdown() {\n\t\tlet ptr = {\n\t\t\tlet mut guard = INSTANCE.lock().unwrap();\n\t\t\tguard.take()\n\t\t};\n\t\tif let Some(p) = ptr {\n\t\t\t// The Drop impl cancels and joins every worker thread.\n\t\t\tunsafe {\n\t\t\t\tdrop(Box::from_raw(p.0));\n\t\t\t}\n\t\t}\n\t}\n\n\t/// Run `f` with the singleton (when initialized), without taking\n\t/// ownership. Used by the C ABI layer.\n\tpub fn with_manager\u003cR\u003e(f: impl FnOnce(\u0026TaskManager) -\u003e R) -\u003e Option\u003cR\u003e {\n\t\tlet guard = INSTANCE.lock().unwrap();\n\t\tguard.as_ref().map(|p| f(unsafe { \u0026*p.0 }))\n\t}\n\n\t/// Run `f` with the singleton mutably (when initialized). Used by the C\n\t/// ABI layer. The caller must not call [`TaskManager::with_manager`]\n\t/// from a worker callback while this is held (same rule as the C++\n\t/// `mutex_`).\n\tpub fn with_manager_mut\u003cR\u003e(f: impl FnOnce(\u0026mut TaskManager) -\u003e R) -\u003e Option\u003cR\u003e {\n\t\tlet mut guard = INSTANCE.lock().unwrap();\n\t\tguard.as_mut().map(|p| f(unsafe { \u0026mut *p.0 }))\n\t}\n\n\t/// Add a task, taking ownership (the manager now owns it). A worker\n\t/// thread is spawned that runs [`Task::start`] on the task.\n\t///\n\t/// The worker runs through a raw pointer while the box lives in\n\t/// `self.tasks`; the shared reference produced by `task()` ends before\n\t/// the pointer is used, so the cast is safe in this exclusively-owned\n\t/// setting.\n\t#[allow(invalid_reference_casting)]\n\tpub fn add_task(\u0026mut self, task: Box\u003cdyn TaskBox\u003e) {\n\t\tlet ptr = task.task() as *const Task as usize as *mut Task;\n\t\tself.tasks.push(task);\n\t\t// The worker only touches the task through the raw pointer; it never\n\t\t// reaches the manager, so the box stays alive in `self.tasks`.\n\t\tlet ptr_usize = ptr as usize;\n\t\tlet handle = std::thread::spawn(move || {\n\t\t\tunsafe {\n\t\t\t\t// The manager tracks success/failure through the task's own\n\t\t\t\t// finished state; the Result is intentionally ignored.\n\t\t\t\tlet _ = (\u0026mut *(ptr_usize as *mut Task)).start();\n\t\t\t}\n\t\t});\n\t\tself.threads.push(Some(handle));\n\t}\n\n\t/// Cancel the task at `index`.\n\t#[allow(invalid_reference_casting)]\n\tpub fn cancel_task(\u0026mut self, index: usize) -\u003e Result\u003c()\u003e {\n\t\tlet task = self.tasks.get(index).ok_or(Error::NotFound)?;\n\t\tlet ptr = task.task() as *const Task as usize as *mut Task;\n\t\tunsafe {\n\t\t\t(\u0026mut *ptr).cancel();\n\t\t}\n\t\tOk(())\n\t}\n\n\t/// Cancel the task at `index` and block until it finishes.\n\tpub fn cancel_task_and_wait(\u0026mut self, index: usize) -\u003e Result\u003c()\u003e {\n\t\tself.cancel_task(index)?;\n\t\tlet handle = self.threads.get_mut(index).and_then(|h| h.take());\n\t\tif let Some(h) = handle {\n\t\t\tlet _ = h.join();\n\t\t}\n\t\tOk(())\n\t}\n\n\t/// Remove finished tasks from the list.\n\tpub fn delete_finished(\u0026mut self) {\n\t\tfor (_task, handle) in self.drain_finished() {\n\t\t\tlet _ = handle.join();\n\t\t}\n\t}\n\n\t/// Number of live tasks.\n\tpub fn get_task_count(\u0026self) -\u003e usize {\n\t\tself.tasks.len()\n\t}\n\n\t/// Borrowed handle to the task at `index`; `Err(Error::NotFound)` if out\n\t/// of range.\n\tpub fn get_task_at(\u0026self, index: usize) -\u003e Result\u003cCHandle\u003e {\n\t\tlet task = self.tasks.get(index).ok_or(Error::NotFound)?;\n\t\tlet ptr = task.task() as *const Task as usize as *mut Task;\n\t\tOk(unsafe { make_borrowed::\u003cTask\u003e(ptr) })\n\t}\n\n\t/// Raw pointer to the task at `index` (stable while the manager owns\n\t/// it). Used by `oaktask_manager_at` to build a borrowed task handle.\n\tpub fn task_ptr_at(\u0026self, index: usize) -\u003e Result\u003c*mut Task\u003e {\n\t\tlet task = self.tasks.get(index).ok_or(Error::NotFound)?;\n\t\tOk(task.task() as *const Task as *mut Task)\n\t}\n\n\t/// Index of the task with the given address.\n\tpub fn find_index(\u0026self, ptr: *const Task) -\u003e Option\u003cusize\u003e {\n\t\tself.tasks\n\t\t\t.iter()\n\t\t\t.position(|t| t.task() as *const Task == ptr)\n\t}\n\n\t/// Cancel the task with the given address (no-op when absent).\n\tpub fn cancel_task_by_ptr(\u0026mut self, ptr: *const Task) {\n\t\tif let Some(index) = self.find_index(ptr) {\n\t\t\tlet _ = self.cancel_task(index);\n\t\t}\n\t}\n\n\t/// Move the worker thread of the task with the given address out of the\n\t/// list so the caller can join it without holding the manager lock.\n\tpub fn take_thread_by_ptr(\u0026mut self, ptr: *const Task) -\u003e Option\u003cstd::thread::JoinHandle\u003c()\u003e\u003e {\n\t\tlet index = self.find_index(ptr)?;\n\t\tself.threads.get_mut(index).and_then(|h| h.take())\n\t}\n\n\t/// Remove every finished task (and its worker thread) from the list,\n\t/// returning the task boxes and thread handles so the caller can join\n\t/// them lock-free (the boxes must stay alive until the threads exit).\n\tpub fn drain_finished(\u0026mut self) -\u003e Vec\u003c(Box\u003cdyn TaskBox\u003e, std::thread::JoinHandle\u003c()\u003e)\u003e {\n\t\tlet mut out = Vec::new();\n\t\tlet mut i = 0;\n\t\twhile i \u003c self.tasks.len() {\n\t\t\tif self.tasks[i].task().is_finished() {\n\t\t\t\tlet task = self.tasks.remove(i);\n\t\t\t\tlet handle = self.threads.remove(i);\n\t\t\t\tif let Some(handle) = handle {\n\t\t\t\t\tout.push((task, handle));\n\t\t\t\t}\n\t\t\t} else {\n\t\t\t\ti += 1;\n\t\t\t}\n\t\t}\n\t\tout\n\t}\n\n\t/// Whether this manager registered the codec submitter itself.\n\tpub fn codec_submitter_registered(\u0026self) -\u003e bool {\n\t\tself.codec_submitter_registered\n\t}\n\n\t/// Mark whether this manager registered the codec submitter.\n\tpub fn set_codec_submitter_registered(\u0026mut self, registered: bool) {\n\t\tself.codec_submitter_registered = registered;\n\t}\n}\n\nimpl Drop for TaskManager {\n\tfn drop(\u0026mut self) {\n\t\t// Cancel every task, then join every worker (mirrors the C++\n\t\t// destructor: cancel all first, then join all).\n\t\t#[allow(invalid_reference_casting)]\n\t\tfor task in \u0026self.tasks {\n\t\t\tlet ptr = task.task() as *const Task as usize as *mut Task;\n\t\t\tunsafe {\n\t\t\t\t(\u0026mut *ptr).cancel();\n\t\t\t}\n\t\t}\n\t\tfor handle in self.threads.iter_mut() {\n\t\t\tif let Some(h) = handle.take() {\n\t\t\t\tlet _ = h.join();\n\t\t\t}\n\t\t}\n\t}\n}\n","traces":[{"line":59,"address":[],"length":0,"stats":{"Line":28}},{"line":60,"address":[],"length":0,"stats":{"Line":28}},{"line":80,"address":[],"length":0,"stats":{"Line":7}},{"line":81,"address":[],"length":0,"stats":{"Line":28}},{"line":82,"address":[],"length":0,"stats":{"Line":26}},{"line":88,"address":[],"length":0,"stats":{"Line":8}},{"line":89,"address":[],"length":0,"stats":{"Line":32}},{"line":90,"address":[],"length":0,"stats":{"Line":8}},{"line":91,"address":[],"length":0,"stats":{"Line":0}},{"line":93,"address":[],"length":0,"stats":{"Line":32}},{"line":94,"address":[],"length":0,"stats":{"Line":8}},{"line":95,"address":[],"length":0,"stats":{"Line":8}},{"line":96,"address":[],"length":0,"stats":{"Line":8}},{"line":98,"address":[],"length":0,"stats":{"Line":8}},{"line":99,"address":[],"length":0,"stats":{"Line":8}},{"line":103,"address":[],"length":0,"stats":{"Line":34}},{"line":104,"address":[],"length":0,"stats":{"Line":34}},{"line":105,"address":[],"length":0,"stats":{"Line":136}},{"line":106,"address":[],"length":0,"stats":{"Line":34}},{"line":108,"address":[],"length":0,"stats":{"Line":42}},{"line":111,"address":[],"length":0,"stats":{"Line":16}},{"line":118,"address":[],"length":0,"stats":{"Line":15}},{"line":119,"address":[],"length":0,"stats":{"Line":60}},{"line":120,"address":[],"length":0,"stats":{"Line":46}},{"line":127,"address":[],"length":0,"stats":{"Line":63}},{"line":128,"address":[],"length":0,"stats":{"Line":252}},{"line":129,"address":[],"length":0,"stats":{"Line":196}},{"line": that it will be useful,\n// but WITHOUT ANY WARRANTY; without even the implied warranty of\n// MERCHANTABILITY or FITNESS FOR A PARTICULAR PURPOSE.  See the\n// GNU General Public License for more details.\n//\n// You should have received a copy of the GNU General Public License\n// along with this program.  If not, see \u003chttp://www.gnu.org/licenses/\u003e.\n\n//! `PreCacheTask`, mirroring `src/task/src/precache/precachetask.h`.\n//!\n//! Renders a footage node (or the whole sequence) through\n//! [`crate::render::RenderTask`] to fill the playback cache. Owns a deep copy\n//! of the project (`OakNodeProject`) and borrows the source footage\n//! (`OakNodeFootage`).\n//!\n//! **Simplifications over the C++**: the deep project copy / viewer wiring\n//! is not built (the render drives the given viewer directly) and the\n//! timeline work-area intersection is replaced by the full footage length.\n//!\n//! CPP-PARITY: src/task/src/precache/precachetask.h\n\nuse crate::bridge;\nuse crate::error::Result;\nuse crate::handle::CHandle;\nuse crate::render::{RenderTask, RenderTaskBehavior};\nuse crate::task::{Task, TaskBehavior};\nuse oakcore_rs::{Rational, TimeRange};\n\n/// A pre-cache task: renders frames and audio of a footage node into the\n/// playback cache without any output file.\npub struct PreCacheTask {\n\t/// The render base (itself a task).\n\tpub render: RenderTask,\n\t/// Owning deep copy of the project (borrowed `OakNodeProject`).\n\tpub project: CHandle,\n\t/// Borrowed source footage (borrowed `OakNodeFootage`).\n\tpub footage: CHandle,\n\t/// Frame index within the footage being cached.\n\tpub index: i32,\n\t/// The sequence node (borrowed `OakNodeSequence`).\n\tpub sequence: CHandle,\n}\n\nimpl PreCacheTask {\n\t/// Create a pre-cache task for the given footage at `index` inside\n\t/// `sequence`.\n\tpub fn new(footage: CHandle, index: i32, sequence: CHandle) -\u003e PreCacheTask {\n\t\t// Video params from the sequence (empty when unavailable).\n\t\tlet mut video_params = CHandle::null();\n\t\tunsafe {\n\t\t\tbridge::node::oaknode_sequence_get_video_params(sequence, 0, \u0026mut video_params);\n\t\t}\n\n\t\tlet filename = footage_filename(footage);\n\t\tlet title = format!(\"Pre-caching {filename}:{index}\");\n\t\tlet base = Task::new(\u0026title, CHandle::null());\n\t\tlet render = RenderTask::new(base, video_params, CHandle::null(), sequence, Default::default(), None);\n\n\t\t// A scratch project for the render color manager (simplified).\n\t\tlet project = unsafe { bridge::node::oaknode_project_init() };\n\n\t\tPreCacheTask {\n\t\t\trender,\n\t\t\tproject,\n\t\t\tfootage,\n\t\t\tindex,\n\t\t\tsequence,\n\t\t}\n\t}\n}\n\nimpl TaskBehavior for PreCacheTask {\n\tfn run(\u0026mut self, task: \u0026mut Task) -\u003e Result\u003c()\u003e {\n\t\t// Share the caller's cancellation atom with the inner render base.\n\t\tself.render.base.set_cancel_atom(task.get_cancel_atom());\n\n\t\t// The full footage length is the cache range (simplified: no\n\t\t// work-area intersection).\n\t\tlet mut len_num = 0i64;\n\t\tlet mut len_den = 1i64;\n\t\tunsafe {\n\t\t\tbridge::node::oaknode_footage_get_video_length(self.footage, \u0026mut len_num, \u0026mut len_den);\n\t\t}\n\t\tlet range = TimeRange::new(Rational::new(0, 1), Rational::new(len_num, len_den));\n\n\t\tlet mut color_manager = unsafe { bridge::node::oaknode_colormanager_init(self.project) };\n\t\tlet mut cache = bridge::render::OakRenderCache::null();\n\t\tunsafe {\n\t\t\tbridge::node::oaknode_node_get_video_frame_cache(self.sequence, \u0026mut cache);\n\t\t}\n\n\t\tself.render.set_render_inputs(color_manager, cache.to_chandle(), 0 /* k_online */, false, range);\n\n\t\t// Drive the render with `self` as the subclass behavior (the C++\n\t\t// virtual dispatch receiver); the render is temporarily moved out to\n\t\t// avoid a self-referential borrow and put back before the handles are\n\t\t// released below.\n\t\tlet mut render = std::mem::replace(\u0026mut self.render, crate::render::RenderTask::placeholder());\n\t\tlet result = render.render(task, self);\n\t\tself.render = render;\n\n\t\tif !cache.ctx.is_null() {\n\t\t\tunsafe {\n\t\t\t\tbridge::render::oakrender_cache_free(\u0026mut cache);\n\t\t\t}\n\t\t}\n\t\tif !color_manager.ctx.is_null() {\n\t\t\tunsafe {\n\t\t\t\tbridge::node::oaknode_colormanager_free(\u0026mut color_manager);\n\t\t\t}\n\t\t}\n\n\t\tresult\n\t}\n}\n\nimpl RenderTaskBehavior for PreCacheTask {\n\tfn frame_downloaded(\u0026mut self, task: \u0026mut Task, frame: CHandle) -\u003e Result\u003c()\u003e {\n\t\t// Do nothing: pre-cache just fills the frame cache.\n\t\tlet _ = (task, frame);\n\t\tOk(())\n\t}\n\n\tfn audio_downloaded(\u0026mut self, task: \u0026mut Task, buffer: CHandle) -\u003e Result\u003c()\u003e {\n\t\t// Pre-cache doesn't cache any audio.\n\t\tlet _ = (task, buffer);\n\t\tOk(())\n\t}\n\n\tfn encode_subtitle(\u0026mut self, task: \u0026mut Task, text: \u0026str) -\u003e Result\u003c()\u003e {\n\t\tlet _ = (task, text);\n\t\tOk(())\n\t}\n}\n\n/// Two-stage read of the footage filename.\nfn footage_filename(footage: CHandle) -\u003e String {\n\tlet needed = unsafe { bridge::node::oaknode_footage_filename(footage, std::ptr::null_mut(), 0) };\n\tif needed \u003c= 0 {\n\t\treturn String::new();\n\t}\n\tlet mut buf = vec![0i8; needed as usize];\n\tunsafe {\n\t\tbridge::node::oaknode_footage_filename(footage, buf.as_mut_ptr(), needed);\n\t}\n\tlet len = buf.iter().position(|\u0026c| c == 0).unwrap_or(buf.len());\n\tunsafe { String::from_utf8_lossy(std::slice::from_raw_parts(buf.as_ptr() as *const u8, len)).into_owned() }\n}\n","traces":[{"line":55,"address":[],"length":0,"stats":{"Line":1}},{"line":57,"address":[],"length":0,"stats":{"Line":2}},{"line":59,"address":[],"length":0,"stats":{"Line":2}},{"line":62,"address":[],"length":0,"stats":{"Line":3}},{"line":63,"address":[],"length":0,"stats":{"Line":2}},{"line":64,"address":[],"length":0,"stats":{"Line":4}},{"line":65,"address":[],"length":0,"stats":{"L s":{"Line":4}}],"covered":33,"coverable":43},{"path":["/","Users","sunyu","Projects","oak","src","task","rust","src","project","import.rs"],"content":"// Oak Video Editor - Non-Linear Video Editor\n// Copyright (C) 2026 Oak Team\n//\n// This program is free software: you can redistribute it and/or modify\n// it under the terms of the GNU General Public License as published by\n// the Free Software Foundation, either version 3 of the License, or\n// (at your option) any later version.\n//\n// This program is distributed in the hope that it will be useful,\n// but WITHOUT ANY WARRANTY; without even the implied warranty of\n// MERCHANTABILITY or FITNESS FOR A PARTICULAR PURPOSE.  See the\n// GNU General Public License for more details.\n//\n// You should have received a copy of the GNU General Public License\n// along with this program.  If not, see \u003chttp://www.gnu.org/licenses/\u003e.\n\n//! `ProjectImportTask`, mirroring `src/task/src/project/import/import.h`.\n//!\n//! Imports media files into a folder of a project. Produces an undoable\n//! `OakUndoCommand` (taken via `take_command()`), tracks per-file import\n//! failures, and supports an optional image-sequence confirmation callback.\n//!\n//! CPP-PARITY: src/task/src/project/import/import.h\n\nuse std::path::Path;\n\nuse crate::bridge;\nuse crate::error::{Error, Result};\nuse crate::ffi::taskhandle::cstr;\nuse crate::handle::CHandle;\nuse crate::task::{Task, TaskBehavior};\n\n/// Callback used to confirm whether a detected image sequence should be\n/// imported as a sequence rather than individual frames, mirroring\n/// `ImageSequenceConfirmFn` in import.h.\npub type ImageSequenceConfirmFn = Box\u003cdyn FnMut(\u0026str, \u0026str) -\u003e bool + Send\u003e;\n\n/// A project-import task. Borrows the destination folder and project.\npub struct ProjectImportTask {\n\t/// The shared task base.\n\tpub base: Task,\n\t/// Destination folder (borrowed `OakNodeFolder`).\n\tpub folder: CHandle,\n\t/// Destination project (borrowed `OakNodeProject`).\n\tpub project: CHandle,\n\t/// Media filenames to import.\n\tpub filenames: Vec\u003cString\u003e,\n\t/// The undo command produced by the task, taken via `take_command`.\n\tcommand: Option\u003cCHandle\u003e,\n\t/// Files that failed to import.\n\tinvalid_files: Vec\u003cString\u003e,\n\t/// Imported footage, taken via `get_imported_footage`.\n\timported_footage: Vec\u003cCHandle\u003e,\n\t/// Optional image-sequence confirmation callback.\n\timage_sequence_confirm: Option\u003cImageSequenceConfirmFn\u003e,\n\t/// Total number of files to import (directories counted recursively).\n\tfile_count: usize,\n\t/// Image-sequence files already decided not to be imported as sequences.\n\timage_sequence_ignore_files: Vec\u003cString\u003e,\n}\n\nimpl Drop for ProjectImportTask {\n\tfn drop(\u0026mut self) {\n\t\tif let Some(command) = \u0026mut self.command {\n\t\t\tif !command.ctx.is_null() {\n\t\t\t\tunsafe {\n\t\t\t\t\tbridge::undo::oakundo_command_free(command);\n\t\t\t\t}\n\t\t\t}\n\t\t}\n\t\t// Borrowed footage handles: releasing them only frees the handle\n\t\t// boxes (the footage nodes are owned by the project).\n\t\tfor footage in \u0026self.imported_footage {\n\t\t\tif !footage.ctx.is_null() {\n\t\t\t\tif let Some(release) = footage.release {\n\t\t\t\t\tunsafe {\n\t\t\t\t\t\trelease(footage.ctx);\n\t\t\t\t\t}\n\t\t\t\t}\n\t\t\t}\n\t\t}\n\t}\n}\n\nimpl ProjectImportTask {\n\t/// Create an import task for the given folder/project and filenames.\n\tpub fn new(\n\t\tbase: Task,\n\t\tfolder: CHandle,\n\t\tproject: CHandle,\n\t\tfilenames: Vec\u003cString\u003e,\n\t\timage_sequence_confirm: Option\u003cImageSequenceConfirmFn\u003e,\n\t\tfile_count: usize,\n\t) -\u003e ProjectImportTask {\n\t\tProjectImportTask {\n\t\t\tbase,\n\t\t\tfolder,\n\t\t\tproject,\n\t\t\tfilenames,\n\t\t\tcommand: None,\n\t\t\tinvalid_files: Vec::new(),\n\t\t\timported_footage: Vec::new(),\n\t\t\timage_sequence_confirm,\n\t\t\tfile_count,\n\t\t\timage_sequence_ignore_files: Vec::new(),\n\t\t}\n\t}\n\n\t/// Take ownership of the produced undo command; `Err(Error::State)` if\n\t/// the task has not run yet.\n\tpub fn take_command(\u0026mut self) -\u003e Result\u003cCHandle\u003e {\n\t\tself.command.take().ok_or(Error::State)\n\t}\n\n\t/// Number of files that failed to import.\n\tpub fn get_invalid_file_count(\u0026self) -\u003e usize {\n\t\tself.invalid_files.len()\n\t}\n\n\t/// Whether any file failed to import.\n\tpub fn has_invalid_files(\u0026self) -\u003e bool {\n\t\t!self.invalid_files.is_empty()\n\t}\n\n\t/// Borrowed handle to the imported footage at `index` (addref'd by the C\n\t/// ABI); `Err(Error::NotFound)` if out of range.\n\tpub fn get_imported_footage(\u0026self, index: usize) -\u003e Result\u003cCHandle\u003e {\n\t\tlet footage = self.imported_footage.get(index).ok_or(Error::NotFound)?;\n\t\tif !footage.ctx.is_null() {\n\t\t\tif let Some(addref) = footage.addref {\n\t\t\t\tunsafe {\n\t\t\t\t\taddref(footage.ctx);\n\t\t\t\t}\n\t\t\t}\n\t\t}\n\t\tOk(*footage)\n\t}\n\n\t/// Total number of imported footage entries.\n\tpub fn get_file_count(\u0026self) -\u003e usize {\n\t\tself.imported_footage.len()\n\t}\n\n\t/// Set the image-sequence confirmation callback.\n\tpub fn set_image_sequence_confirm_callback(\u0026mut self, cb: ImageSequenceConfirmFn) {\n\t\tself.image_sequence_confirm = Some(cb);\n\t}\n\n\t/// The number of files counted at construction (progress denominator).\n\tpub fn file_count(\u0026self) -\u003e usize {\n\t\tself.file_count\n\t}\n\n\t/// The invalid filename at `index` (assumes the index is in range).\n\tpub(crate) fn invalid_file_at(\u0026self, index: usize) -\u003e \u0026str {\n\t\t\u0026self.invalid_files[index]\n\t}\n\n\tfn import(\u0026mut self, task: \u0026mut Task, folder: CHandle, entries: \u0026mut Vec\u003cString\u003e, counter: \u0026mut usize, parent_command: CHandle) {\n\t\tlet mut i = 0;\n\t\twhile i \u003c entries.len() {\n\t\t\tif task.is_cancelled() {\n\t\t\t\tbreak;\n\t\t C ABI\n\t/// (`bridge::node`), collecting an undo command, imported footage, and\n\t/// per-file failures.\n\tfn run(\u0026mut self, task: \u0026mut Task) -\u003e Result\u003c()\u003e {\n\t\tlet mut command = unsafe { bridge::undo::oakundo_command_init_multi() };\n\t\tif command.ctx.is_null() {\n\t\t\ttask.set_error(\"Failed to create import command\");\n\t\t\treturn Err(Error::Failed(\"Failed to create import command\".to_string()));\n\t\t}\n\t\tself.command = Some(command);\n\n\t\tlet mut counter = 0;\n\t\tlet mut entries = self.filenames.clone();\n\t\tself.import(task, self.folder, \u0026mut entries, \u0026mut counter, command);\n\n\t\tif task.is_cancelled() {\n\t\t\tif !command.ctx.is_null() {\n\t\t\t\tunsafe {\n\t\t\t\t\tbridge::undo::oakundo_command_free(\u0026mut command);\n\t\t\t\t}\n\t\t\t}\n\t\t\tself.command = None;\n\t\t\treturn Err(Error::Cancelled);\n\t\t}\n\t\tOk(())\n\t}\n}\n\n/// Count files recursively (directories recurse; anything else counts 1),\n/// mirroring `count_files_recursive` in import.cpp.\nfn count_files_recursive(paths: \u0026[String]) -\u003e usize {\n\tpaths\n\t\t.iter()\n\t\t.map(|p| {\n\t\t\tlet path = Path::new(p);\n\t\t\tif path.is_dir() {\n\t\t\t\tcount_dir_files(path)\n\t\t\t} else {\n\t\t\t\t1\n\t\t\t}\n\t\t})\n\t\t.sum()\n}\n\nfn count_dir_files(dir: \u0026Path) -\u003e usize {\n\tmatch std::fs::read_dir(dir) {\n\t\tOk(rd) =\u003e rd\n\t\t\t.filter_map(|e| e.ok())\n\t\t\t.map(|e| {\n\t\t\t\tlet p = e.path();\n\t\t\t\tif p.is_dir() {\n\t\t\t\t\tcount_dir_files(\u0026p)\n\t\t\t\t} else {\n\t\t\t\t\t1\n\t\t\t\t}\n\t\t\t})\n\t\t\t.sum(),\n\t\tErr(_) =\u003e 0,\n\t}\n}\n\n/// `std::filesystem::path(filename).filename()`, as a String.\nfn basename_of(path: \u0026str) -\u003e String {\n\tPath::new(path)\n\t\t.file_name()\n\t\t.map(|n| n.to_string_lossy().into_owned())\n\t\t.unwrap_or_default()\n}\n\n/// Two-stage read of the footage filename.\nfn footage_filename(footage: CHandle) -\u003e String {\n\tlet needed = unsafe { bridge::n
