# actionlint configuration: whitelist the WarpBuild runner labels used by
# the CI/CD workflows so `actionlint ci.yml` / `actionlint cd.yml` passes.
# See https://github.com/rhysd/actionlint/blob/main/docs/config.md
self-hosted-runner:
  labels:
    - warp-ubuntu-latest-x64-8x
    - warp-windows-latest-x64-16x
    - warp-windows-2025-vs2026-x64-16x
    - warp-macos-26-arm64-6x
